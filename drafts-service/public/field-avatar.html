<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>مساعدة المكتب</title>
<style>
  :root{--bg:#0b0f14;--card:#121a24;--ink:#eaf1fb;--muted:#8d9bb5;--accent:#ffb347;--bad:#f87171}
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.7 "Segoe UI",Tahoma,Arial,sans-serif}
  #gate{min-height:100%;display:grid;place-items:center;padding:20px}
  .card{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:26px 22px;width:100%;max-width:360px}
  h1{margin:0 0 4px;font-size:22px} p{margin:0 0 16px;color:var(--muted);font-size:14px}
  input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:#0b0f14;color:var(--ink);font:inherit;font-size:18px;text-align:center;letter-spacing:3px;direction:ltr}
  button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#1a1000;font:inherit;font-weight:700;cursor:pointer}
  button:disabled{opacity:.6}
  #err{color:var(--bad);font-size:14px;min-height:22px;margin-top:10px;text-align:center}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
  #state{position:fixed;inset:0;z-index:4;display:none;place-items:center;padding:24px;text-align:center;color:var(--muted);font-size:15px;pointer-events:none}
  #state.show{display:grid} #state b{color:var(--ink);display:block;margin-bottom:6px}
  #pick{display:none;gap:12px;flex-direction:column;margin-top:4px}
  #pick button{margin:0}
  #pick .alt{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.25)}
  #pick small{display:block;font-weight:400;opacity:.75;font-size:12.5px}
  #classic{position:fixed;top:8px;right:8px;z-index:5;display:none;background:rgba(255,255,255,.12);color:var(--ink);border:0;border-radius:20px;padding:5px 12px;font-size:12.5px;width:auto;margin:0;font-weight:500}
  #out{position:fixed;top:8px;left:8px;z-index:5;display:none;background:rgba(255,255,255,.12);color:var(--ink);border:0;border-radius:20px;padding:5px 12px;font-size:12.5px;width:auto;margin:0;font-weight:500}
</style>
</head>
<body>
<div id="gate">
  <form class="card" id="form">
    <h1>مساعدة المكتب</h1>
    <p>اكتب الكود اللي المالك إداهولك.</p>
    <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="كود الدخول" required>
    <button id="go" type="submit">ادخل</button>
    <div id="err" role="alert"></div>
    <div id="pick">
      <button type="button" id="pickAvatar">مساعدة المكتب (الأفاتار)<small>اضغط الميكروفون وتكلم</small></button>
      <button type="button" id="pickClassic" class="alt">الصفحة الأصلية<small>الميكروفون والكتابة زي الأول</small></button>
    </div>
  </form>
</div>
<div id="state" role="status"></div>
<button id="classic" type="button">الصفحة الأصلية</button>
<button id="out" type="button">خروج</button>
<iframe id="frame" title="مساعدة المكتب" allow="microphone; autoplay" referrerpolicy="no-referrer"></iframe>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const KEY = 'pm_field_code';
const get = () => { try { return sessionStorage.getItem(KEY) || ''; } catch (e) { return ''; } };
const put = v => { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch (e) {} };
let cfg = null, token = '', waitTimer = 0;
const status = (html) => { const el = $('state'); el.innerHTML = html || ''; el.classList.toggle('show', !!html); };

// The avatar asks for a sign-in when its frame is ready; only its own origin may receive the token.
addEventListener('message', e => {
  if (!cfg || e.source !== $('frame').contentWindow || e.origin !== new URL(cfg.url).origin) return;
  if (e.data && e.data.type === 'matrix:ready' && token) { clearTimeout(waitTimer); status(''); e.source.postMessage({ type: 'matrix:sso', token }, e.origin); }
  if (e.data && e.data.type === 'matrix:error') { clearTimeout(waitTimer); status('<div><b>المساعدة مفتحتش</b>' + String(e.data.message || '').replace(/[<>&]/g, '') + '</div>'); }
});

async function login(code) {
  const r = await fetch('/api/field/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'الكود غلط');
  if (!j.sso_token) throw new Error('المساعدة مش متوصلة دلوقتي');
  return j.sso_token;
}

function open(t) {
  token = t;
  $('gate').style.display = 'none'; $('frame').style.display = 'block'; $('out').style.display = 'block'; $('classic').style.display = 'block';
  status('<div><b>بفتح المساعدة…</b>أول مرة ممكن تاخد دقيقة</div>');
  clearTimeout(waitTimer);
  waitTimer = setTimeout(() => status('<div><b>المساعدة مردّتش</b>اتأكد من النت وارجع جرّب تاني. لو فضلت كده قول للمالك.</div>'), 60000);
  $('frame').src = cfg.url + '/embed/' + encodeURIComponent(cfg.pk) + '?full=1';
}

$('out').onclick = () => { put(''); location.reload(); };
$('classic').onclick = () => { location.href = '/classic'; };
// After the code is accepted the person picks: the avatar, or the original page (same code, nothing to type again).
function choose(t) {
  $('code').style.display = 'none'; $('go').style.display = 'none'; $('pick').style.display = 'flex';
  $('pickAvatar').onclick = () => open(t);
  $('pickClassic').onclick = () => { location.href = '/classic'; };
}
$('form').onsubmit = async ev => {
  ev.preventDefault(); $('err').textContent = ''; $('go').disabled = true;
  const code = $('code').value.trim();
  try { const t = await login(code); put(code); choose(t); } catch (e) { $('err').textContent = e.message; } finally { $('go').disabled = false; }
};

(async () => {
  try { cfg = (await (await fetch('/api/field/avatar')).json()).avatar; } catch (e) {}
  if (!cfg) { $('err').textContent = 'المساعدة مش متوصلة دلوقتي'; $('go').disabled = true; return; }
  const saved = get();
  if (saved) { try { choose(await login(saved)); } catch (e) { put(''); } }
})();
})();
</script>
</body>
</html>

// ── Print: opens a new window with a print-friendly statement and auto-prints
function printPartyStatement(party,type,entries,balance){
  const partyLabel=type==='customer'?'العميل':'المورد';
  const totalDebit=entries.reduce((s,e)=>s+e.debit,0);
  const totalCredit=entries.reduce((s,e)=>s+e.credit,0);
  const printDate=new Date().toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'});
  const w=window.open('','_blank','width=900,height=720');
  if(!w){showToast('⚠ يرجى السماح بالنوافذ المنبثقة للطباعة');return;}
  // Group entries by transaction type (sales / collections, or purchases / payments)
  const groupLabels={'بيع':'المبيعات','شراء':'المشتريات','تحصيل':'التحصيلات','دفعة':'الدفعات','مقاصة':'المقاصات'};
  const orderPriority={'بيع':1,'شراء':1,'تحصيل':2,'دفعة':2,'مقاصة':3};
  const groups={};
  entries.forEach(e=>{
    if(!groups[e.type])groups[e.type]={items:[],debit:0,credit:0};
    groups[e.type].items.push(e);
    groups[e.type].debit+=e.debit;
    groups[e.type].credit+=e.credit;
  });
  const sortedTypes=Object.keys(groups).sort((a,b)=>(orderPriority[a]||9)-(orderPriority[b]||9));
  let rowsHtml='';
  if(!entries.length){
    rowsHtml='<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--faint)">لا توجد معاملات</td></tr>';
  } else {
    sortedTypes.forEach(type=>{
      const g=groups[type];
      const label=groupLabels[type]||type;
      const badgeCls=(type==='بيع'||type==='شراء')?'badge-w':'badge-s';
      rowsHtml+=`<tr class="grp-hdr"><td colspan="4"><span class="badge ${badgeCls}">${label}</span> <span class="grp-count">(${g.items.length} ${g.items.length===1?'معاملة':'معاملات'})</span></td></tr>`;
      g.items.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
        rowsHtml+=`<tr>
          <td>${e.date}</td>
          <td>${esc(e.desc)}</td>
          <td class="red">${e.debit>0?fmt(e.debit):'—'}</td>
          <td class="green">${e.credit>0?fmt(e.credit):'—'}</td>
        </tr>`;
      });
      rowsHtml+=`<tr class="grp-sub"><td><strong>إجمالي ${label}</strong></td><td></td><td class="red"><strong>${g.debit>0?fmt(g.debit):'—'}</strong></td><td class="green"><strong>${g.credit>0?fmt(g.credit):'—'}</strong></td></tr>`;
    });
  }
  const html=`<!DOCTYPE html>

function showStatementOverlay(party,type,entries,balance){
  const ex=document.getElementById('stmt-overlay');if(ex)ex.remove();
  const ov=el('div',{style:'position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px'});
  ov.id='stmt-overlay';
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  const box=el('div',{style:'background:var(--surface);border-radius:14px;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,0.15)'});
  const hdr=el('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:18px'});
  hdr.appendChild(el('div',{style:'font-size:15px;font-weight:600'},`كشف حساب — ${esc(party.name)}`));
  const hdrActions=el('div',{style:'display:flex;gap:6px;align-items:center'});
  const prn=el('button',{cls:'btn-primary',style:'font-size:12px;padding:5px 14px',title:'طباعة كشف الحساب'},'🖨 طباعة');
  prn.onclick=()=>printPartyStatement(party,type,entries,balance);
  hdrActions.appendChild(prn);
  // Dual-role party → one click to the unified statement
  const twinS=type==='customer'?supplierOfCustomer(party.id):party, twinC=type==='customer'?party:linkedCustomer(party);
  if(twinS && twinC){
    const ub=el('button',{cls:'btn-ghost',style:'font-size:12px;padding:5px 12px',title:'الشخص ده مورد وعميل — شوف الصافي النهائي'},'🔗 الكشف الموحد');
    ub.onclick=()=>showUnifiedStatement(twinS,twinC);
    hdrActions.appendChild(ub);
  }
  const cls=el('button',{style:'background:none;border:none;font-size:20px;color:var(--faint);cursor:pointer'},'✕');
  cls.onclick=()=>ov.remove();
  hdrActions.appendChild(cls);
  hdr.appendChild(hdrActions);
  box.appendChild(hdr);
  const tbl=document.createElement('table');
  tbl.style.cssText='width:100%;border-collapse:collapse;font-size:13px';
  tbl.innerHTML=`<thead><tr style="background:var(--surface-2)">
    <th scope="col" style="padding:8px 10px;text-align:right;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border);font-weight:500">التاريخ</th>
    <th scope="col" style="padding:8px 10px;text-align:right;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border);font-weight:500">النوع</th>
    <th scope="col" style="padding:8px 10px;text-align:right;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border);font-weight:500">البيان</th>
    <th scope="col" style="padding:8px 10px;text-align:right;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border);font-weight:500">مدين</th>
    <th scope="col" style="padding:8px 10px;text-align:right;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border);font-weight:500">دائن</th>
    <th scope="col" style="padding:8px 10px;text-align:right;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border);font-weight:500">الرصيد</th>
  </tr></thead>`;
  const tbody=document.createElement('tbody');
  let running=0;
  if(!entries.length){
    const tr=document.createElement('tr');
    tr.innerHTML='<td colspan="6" style="padding:24px;text-align:center;color:var(--faint)">لا توجد معاملات</td>';
    tbody.appendChild(tr);
  }
  entries.forEach(e=>{
    running+=e.debit-e.credit;
    const tr=document.createElement('tr');tr.style.borderBottom='1px solid var(--border)';
    const badge=e.type==='بيع'||e.type==='شراء'
      ?`<span class="badge badge-warning">${e.type}</span>`
      :`<span class="badge badge-success">${e.type}</span>`;
    tr.innerHTML=`
      <td style="padding:9px 10px;color:var(--muted)">${e.date}</td>
      <td style="padding:9px 10px">${badge}</td>
      <td style="padding:9px 10px;color:var(--ink-2)">${esc(e.desc)}</td>
      <td style="padding:9px 10px;color:var(--neg);font-weight:500">${e.debit>0?fmt(e.debit):'—'}</td>
      <td style="padding:9px 10px;color:var(--pos);font-weight:500">${e.credit>0?fmt(e.credit):'—'}</td>
      <td style="padding:9px 10px;font-weight:600;color:${running>0?'var(--neg)':'var(--pos)'}">${fmt(running)}</td>`;
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  box.appendChild(el('div',{style:'overflow-x:auto'},[tbl]));
  const sumDiv=el('div',{style:`margin-top:16px;padding:14px 16px;background:${balance<=0?'var(--pos-soft)':'var(--neg-soft)'};border-radius:10px;display:flex;justify-content:space-between;align-items:center`});
  sumDiv.appendChild(el('span',{style:'font-size:13px;color:var(--muted)'},balance<=0?'✓ تم السداد كاملاً':'الرصيد المتبقي'));
  sumDiv.appendChild(el('span',{style:`font-size:18px;font-weight:700;color:${balance<=0?'var(--pos)':'var(--neg)'}`},fmt(Math.abs(balance))));
  box.appendChild(sumDiv);
  ov.appendChild(box);document.body.appendChild(ov);
}
function render(){
  const nav=document.getElementById('nav');nav.innerHTML='';
  NAV.forEach(n=>{
    const active=DB.view===n.id;
    const b=document.createElement('button');b.className=`nav-btn ${active?'active':''}`;
    if(active) b.setAttribute('aria-current','page');
    b.textContent=n.l;b.onclick=()=>{DB.view=n.id;render();};nav.appendChild(b);
  });
  document.getElementById('view-title').textContent=TITLES[DB.view];
  const views={dashboard:renderDashboard,purchases:renderPurchases,sales:renderSales,inventory:renderInventory,contacts:renderContacts,expenses:renderExpenses,accounts:renderAccounts,pl:renderPL,balance:renderBalance,distribution:renderDistribution,ai:renderAI};
  const content=document.getElementById('content');content.innerHTML='';
  if(views[DB.view])content.appendChild(views[DB.view]());
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.getElementById('sdate').textContent = new Date().toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'});
document.getElementById('modal-overlay').onclick = e=>{if(e.target===document.getElementById('modal-overlay'))closeModal();};
document.getElementById('confirm-overlay').onclick = e=>{if(e.target===document.getElementById('confirm-overlay'))closeConfirm();};
// Esc closes whichever overlay is open (modal → confirm → statement); Tab is trapped inside dialogs
document.addEventListener('keydown', e=>{
  if(e.key==='Tab'){ _trapTab(e); return; }
  if(e.key!=='Escape') return;
  const st=document.getElementById('stmt-overlay');
  if(document.getElementById('modal-overlay').classList.contains('open')) closeModal();
  else if(document.getElementById('confirm-overlay').classList.contains('open')) closeConfirm();
  else if(st) st.remove();
});
// Warn before leaving with unsaved-to-file changes (data is still autosaved locally)
window.addEventListener('beforeunload', e=>{ persistLocal(); if(_dirty){ e.preventDefault(); e.returnValue=''; } });
// Global safety net — surface an unexpected error gracefully instead of a silent frozen UI.
// Gated on e.message so font/resource load failures never trigger a spurious toast.
window.addEventListener('error', e=>{ if(e && e.message){ try{ console.error('Unhandled error:', e.message); showToast('⚠ حدث خطأ غير متوقع — بياناتك محفوظة. أعد تحميل الصفحة إن استمرت المشكلة.'); }catch(_){} } });
window.addEventListener('unhandledrejection', e=>{ try{ console.error('Unhandled rejection:', e.reason); }catch(_){} });
_applyThemeIcon();                   // sync the light/dark toggle icon with the active theme
aiLoad();                            // AI provider/key config (localStorage only — never in DB)
render();
const _hadLocal = restoreLocal();   // restore unsaved work from a previous session first
updateSaveState();
_restoreLinkedFile(_hadLocal);       // relink file handle; only auto-load it if no local copy existed
</script>

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   DESIGN TOKENS — one system, two themes. Every colour flows through a variable
   so the light/dark toggle re-themes the entire app instantly & consistently.
   Identity: Emerald (brand / positive) + Gold (attention / assets).
   ═══════════════════════════════════════════════════════════════════════════ */
:root, :root[data-theme="light"]{
  --font: 'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
  --font-display: 'Cairo','Tajawal','Segoe UI',Tahoma,sans-serif;
  /* canvas & surfaces */
  --bg:#F4F1EA; --bg-2:#ECE8DF;
  --surface:#FFFFFF; --surface-2:#F6F3EC; --surface-3:#FBF9F4;
  --border:#E7E2D7; --border-strong:#D8D2C4;
  /* ink */
  --ink:#1A1611; --ink-2:#463F35; --muted:#6C6459; --faint:#75705F; --faint-2:#B0A896;
  /* emerald (brand + primary) */
  --accent:#0F6B4F; --accent-2:#0B5842; --accent-ink:#0C5B43;
  --accent-soft:#E3EEE8; --accent-border:#BEDDCF; --on-accent:#FFFFFF;
  /* gold (attention / assets / save) */
  --gold:#A97E22; --gold-2:#C6A15B; --gold-ink:#8A6414;
  --gold-soft:#F5EDDA; --gold-border:#E6D3A9; --on-gold:#2C2208;
  /* semantic money */
  --pos:#1E7A4A; --pos-soft:#E2F0E7;
  --neg:#B23A34; --neg-soft:#FAEAE9; --neg-border:#E7B2AE;
  --warn:#8A6414; --warn-soft:#F5EDDA;
  --info-soft:#E9EEF6;
  /* effects */
  --glass:rgba(255,255,255,0.72); --glass-brd:rgba(231,226,215,0.8);
  --shadow-sm:0 1px 2px rgba(28,22,12,.05), 0 1px 3px rgba(28,22,12,.04);
  --shadow-md:0 2px 6px rgba(28,22,12,.05), 0 10px 26px rgba(28,22,12,.06);
  --shadow-lg:0 18px 48px rgba(28,22,12,.16), 0 6px 16px rgba(28,22,12,.08);
  --shadow-accent:0 6px 18px rgba(15,107,79,.28);
  --ring:0 0 0 3px rgba(15,107,79,.16);
  --scrim:rgba(30,26,18,.34);
  --r-sm:9px; --r-md:13px; --r-lg:17px; --r-xl:22px;
  --ease:cubic-bezier(.4,0,.2,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --page-grad:radial-gradient(1200px 600px at 88% -8%, rgba(15,107,79,.06), transparent 60%),
              radial-gradient(1000px 620px at 4% 108%, rgba(198,161,91,.07), transparent 55%),
              linear-gradient(160deg, var(--bg), var(--bg-2));
}
:root[data-theme="dark"]{
  --bg:#0C0E0D; --bg-2:#121514;
  --surface:#171A18; --surface-2:#1E2220; --surface-3:#22262330;
  --border:#2A2F2C; --border-strong:#3A403C;
  --ink:#F1EFE9; --ink-2:#CBC7BC; --muted:#9A9488; --faint:#918B7D; --faint-2:#5E5A50;
  --accent:#3FBE8C; --accent-2:#57CE9E; --accent-ink:#5BD3A2;
  --accent-soft:rgba(63,190,140,.14); --accent-border:rgba(63,190,140,.32); --on-accent:#07130D;
  --gold:#D9B978; --gold-2:#E7CB92; --gold-ink:#E1C078;
  --gold-soft:rgba(217,185,120,.13); --gold-border:rgba(217,185,120,.32); --on-gold:#1B1405;
  --pos:#4FC98C; --pos-soft:rgba(79,201,140,.14);
  --neg:#F0736B; --neg-soft:rgba(240,115,107,.14); --neg-border:rgba(240,115,107,.4);
  --warn:#E1C078; --warn-soft:rgba(217,185,120,.13);
  --info-soft:rgba(120,150,210,.12);
  --glass:rgba(19,22,20,0.66); --glass-brd:rgba(255,255,255,0.06);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 2px 8px rgba(0,0,0,.44), 0 12px 30px rgba(0,0,0,.4);
  --shadow-lg:0 24px 60px rgba(0,0,0,.62), 0 8px 22px rgba(0,0,0,.5);
  --shadow-accent:0 8px 22px rgba(63,190,140,.28);
  --ring:0 0 0 3px rgba(63,190,140,.22);
  --scrim:rgba(0,0,0,.6);
  --page-grad:radial-gradient(1200px 640px at 86% -10%, rgba(63,190,140,.10), transparent 58%),
              radial-gradient(1000px 640px at 2% 110%, rgba(217,185,120,.07), transparent 55%),
              linear-gradient(160deg, var(--bg), var(--bg-2));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;display:flex;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:.1px}
/* gradient canvas on a fixed layer — repaints reliably on theme change (unlike background-attachment:fixed) */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--page-grad);pointer-events:none}
button,input,select{font-family:inherit}
/* smooth cross-fade only while toggling themes (never interferes with hovers) */
.theming, .theming *{transition:background-color .38s var(--ease), color .32s var(--ease), border-color .38s var(--ease), box-shadow .38s var(--ease) !important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--faint)}
::selection{background:var(--accent-soft);color:var(--accent-ink)}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ── Sidebar ───────────────────────────────────────────────────────────── */
#sidebar{width:232px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;height:100vh;position:relative;z-index:2;box-shadow:var(--shadow-sm)}
.brand{padding:22px 20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px}
.brand-mark{width:34px;height:34px;border-radius:10px;flex-shrink:0;background:linear-gradient(145deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:var(--on-accent);font-family:var(--font-display);font-weight:800;font-size:17px;box-shadow:var(--shadow-accent)}
.brand-name{font-family:var(--font-display);font-size:16px;font-weight:800;color:var(--ink);letter-spacing:.2px}
.brand-sub{font-size:10px;color:var(--faint);margin-top:3px;letter-spacing:1.6px;text-transform:uppercase;font-weight:600}
nav{flex:1;padding:14px 12px;overflow-y:auto}
.nav-sec{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);font-weight:700;padding:6px 12px 8px}
.nav-btn{position:relative;display:block;width:100%;text-align:right;padding:10px 14px;margin-bottom:3px;border-radius:var(--r-sm);border:none;cursor:pointer;font-size:13.5px;background:transparent;color:var(--muted);font-weight:500;transition:background .16s var(--ease),color .16s var(--ease),transform .16s var(--ease)}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.nav-btn.active::before{content:"";position:absolute;right:0;top:50%;transform:translateY(-50%);width:3px;height:56%;border-radius:3px;background:var(--accent)}
.sidebar-footer{padding:14px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--faint)}

/* ── Shell ─────────────────────────────────────────────────────────────── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{padding:13px 24px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:relative;z-index:3}
#topbar h2{font-family:var(--font-display);font-size:19px;font-weight:800;color:var(--ink);flex:1;letter-spacing:.2px}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
#content{flex:1;overflow-y:auto;padding:26px 28px 40px;scroll-behavior:smooth}
#content>*{animation:riseIn .34s var(--ease-out) both}

/* ── Cards & stats ─────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px 24px;box-shadow:var(--shadow-md)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}
.stat-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:17px 18px;box-shadow:var(--shadow-sm);overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease)}
.stat-card::before{content:"";position:absolute;top:0;right:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--accent) 70%);opacity:.5}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--border-strong)}
.stat-label{font-size:11.5px;color:var(--muted);margin-bottom:7px;font-weight:600;letter-spacing:.2px}
.stat-value{font-size:21px;font-weight:800;font-family:var(--font-display);letter-spacing:.2px;font-variant-numeric:tabular-nums}

/* ── Tables ────────────────────────────────────────────────────────────── */
.tbl-wrap{overflow-x:auto;border-radius:var(--r-sm)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:var(--surface-2)}
th{padding:11px 13px;text-align:right;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);white-space:nowrap;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase}
tbody tr{border-bottom:1px solid var(--border);transition:background .14s var(--ease)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td{padding:12px 13px;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.empty-row td{padding:40px;text-align:center;color:var(--faint);font-size:13px}
.del-btn{background:none;border:none;color:var(--neg);cursor:pointer;font-size:14px;padding:3px 7px;border-radius:6px;transition:background .14s var(--ease)}
.del-btn:hover{background:var(--neg-soft)}
/* ── Table toolbar: search · sort · pagination ── */
.tbl-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.tbl-search{flex:1;max-width:360px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:20px;padding:9px 16px;color:var(--ink);font-size:13px;font-family:inherit;outline:none;transition:border-color .16s var(--ease),box-shadow .16s var(--ease),background .16s var(--ease)}
.tbl-search::placeholder{color:var(--faint)}
.tbl-search:focus{border-color:var(--accent);box-shadow:var(--ring);background:var(--surface)}
.tbl-search::-webkit-search-cancel-button{cursor:pointer}
.tbl-count{font-size:11.5px;color:var(--faint);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
th.th-sort{cursor:pointer;user-select:none;transition:color .14s var(--ease),background .14s var(--ease)}
th.th-sort:hover{color:var(--accent-ink);background:var(--accent-soft)}
.sort-arrow{font-size:9px;opacity:.7;letter-spacing:0}
.tbl-pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.pager-btn{background:var(--surface);color:var(--ink-2);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:7px 15px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .16s var(--ease)}
.pager-btn:hover:not(:disabled){background:var(--surface-2);border-color:var(--faint);transform:translateY(-1px)}
.pager-btn:disabled{opacity:.4;cursor:not-allowed}
.pager-info{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ── Buttons ───────────────────────────────────────────────────────────── */
.btn-primary,.btn-success,.btn-ghost,.btn-danger{border-radius:var(--r-sm);padding:9px 17px;font-size:13px;font-weight:700;cursor:pointer;transition:transform .16s var(--ease),box-shadow .16s var(--ease),background .16s var(--ease),border-color .16s var(--ease),opacity .16s var(--ease);letter-spacing:.2px}
.btn-primary{background:linear-gradient(145deg,var(--accent),var(--accent-2));color:var(--on-accent);border:none;box-shadow:var(--shadow-accent)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(15,107,79,.34)}
.btn-primary:active{transform:translateY(0)}
.btn-success{background:linear-gradient(145deg,var(--gold-2),var(--gold));color:var(--on-gold);border:none;box-shadow:0 4px 14px rgba(169,126,34,.28)}
.btn-success:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(169,126,34,.34)}
.btn-success:active{transform:translateY(0)}
.btn-ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--border-strong)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--faint);transform:translateY(-1px)}
.btn-danger{background:transparent;color:var(--neg);border:1px solid var(--neg-border)}
.btn-danger:hover{background:var(--neg-soft);transform:translateY(-1px)}

/* ── Badges ────────────────────────────────────────────────────────────── */
.badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:7px;font-weight:700;letter-spacing:.2px;border:1px solid transparent}
.badge-success{background:var(--pos-soft);color:var(--pos);border-color:color-mix(in srgb,var(--pos) 22%,transparent)}
.badge-danger{background:var(--neg-soft);color:var(--neg);border-color:var(--neg-border)}
.badge-warning{background:var(--warn-soft);color:var(--warn);border-color:var(--gold-border)}
.badge-info{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-border)}

/* ── Tabs ──────────────────────────────────────────────────────────────── */
.tbl-footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.tab-row{display:flex;gap:8px;margin-bottom:18px}
.tab-btn{padding:8px 20px;border-radius:var(--r-sm);font-size:13px;font-weight:700;cursor:pointer;transition:all .16s var(--ease)}
.tab-active{background:linear-gradient(145deg,var(--accent),var(--accent-2));color:var(--on-accent);border:none;box-shadow:var(--shadow-accent)}
.tab-inactive{background:var(--surface);color:var(--muted);border:1px solid var(--border-strong)}
.tab-inactive:hover{background:var(--surface-2);color:var(--ink);border-color:var(--faint)}

/* ── Dashboard lists ───────────────────────────────────────────────────── */
.recent-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.recent-item:last-child{border-bottom:none}
.recent-mat{font-size:13.5px;color:var(--ink);font-weight:600}
.recent-sub{font-size:11px;color:var(--faint);margin-top:3px}

/* ── P&L ───────────────────────────────────────────────────────────────── */
.pl-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.pl-row.bold{border-bottom:none}
.pl-sep{height:1px;background:var(--border);margin:8px 0}
.pl-summary{margin-top:20px;padding:18px 20px;background:linear-gradient(150deg,var(--accent-soft),transparent);border-radius:var(--r-md);border:1px solid var(--accent-border)}
/* P&L period filter */
.pl-filter{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.pl-presets{display:flex;gap:6px;flex-wrap:wrap}
.pl-chip{padding:7px 15px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border-strong);background:var(--surface);color:var(--muted);transition:all .16s var(--ease)}
.pl-chip:hover{background:var(--surface-2);color:var(--ink);border-color:var(--faint);transform:translateY(-1px)}
.pl-chip.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-border)}
.pl-dates{display:flex;gap:9px;align-items:flex-end}
.pl-dates .field{margin-bottom:0}
.pl-dates input{min-width:148px}
@media (max-width:640px){ .pl-filter{flex-direction:column;align-items:stretch} .pl-dates{width:100%} .pl-dates .field{flex:1} .pl-dates input{min-width:0;width:100%} }

/* ── Toast ─────────────────────────────────────────────────────────────── */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--bg);padding:12px 16px 12px 24px;border-radius:11px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s var(--ease),transform .3s var(--ease-out);pointer-events:none;z-index:999;white-space:nowrap;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:14px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.actionable{pointer-events:auto}
.toast-undo{display:none;background:var(--bg);color:var(--ink);border:none;border-radius:7px;padding:6px 13px;font-size:12px;font-weight:800;font-family:inherit;cursor:pointer;flex-shrink:0;transition:opacity .15s var(--ease),transform .15s var(--ease)}
.toast-undo:hover{opacity:.82;transform:translateY(-1px)}
#toast.actionable .toast-undo{display:inline-block}

/* ── Modal ─────────────────────────────────────────────────────────────── */
#modal-overlay{display:none;position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:20px}
#modal-overlay.open{display:flex;animation:fadeIn .2s var(--ease)}
#modal-box{background:var(--surface);border-radius:var(--r-xl);border:1px solid var(--border);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:26px 28px;box-shadow:var(--shadow-lg);animation:modalIn .32s var(--ease-out)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.modal-title{font-family:var(--font-display);font-size:17px;font-weight:800;color:var(--ink)}
.modal-close{background:var(--surface-2);border:none;font-size:16px;cursor:pointer;color:var(--muted);line-height:1;padding:0;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:all .14s var(--ease)}
.modal-close:hover{color:var(--ink);background:var(--border)}
.modal-footer{display:flex;gap:9px;justify-content:flex-end;margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}

/* ── Confirm ───────────────────────────────────────────────────────────── */
#confirm-overlay{display:none;position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:20px}
#confirm-overlay.open{display:flex;animation:fadeIn .2s var(--ease)}
#confirm-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px;max-width:380px;width:100%;box-shadow:var(--shadow-lg);animation:modalIn .32s var(--ease-out)}
#confirm-box h3{font-family:var(--font-display);font-size:17px;font-weight:800;margin-bottom:12px;color:var(--ink)}
#confirm-box p{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.75}
.confirm-btns{display:flex;gap:9px;justify-content:flex-end}

/* ── Form fields ───────────────────────────────────────────────────────── */
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.2px}
.field input,.field select{width:100%;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:10px 13px;color:var(--ink);font-size:13.5px;font-family:inherit;outline:none;transition:border-color .16s var(--ease),box-shadow .16s var(--ease),background .16s var(--ease)}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:var(--ring);background:var(--surface)}
.field input::placeholder{color:var(--faint)}
.field-row{display:grid;gap:11px;margin-bottom:14px}
.field-2{grid-template-columns:2fr 1fr}
.info-box{border-radius:var(--r-sm);padding:11px 15px;font-size:13px;margin-bottom:13px;border:1px solid transparent}
.info-buy{background:var(--gold-soft);color:var(--gold-ink);border-color:var(--gold-border)}
.info-sell{background:var(--pos-soft);color:var(--pos);border-color:color-mix(in srgb,var(--pos) 22%,transparent)}

/* ── Live impact panel: real-time preview of a form's effect on cash / party balance / stock ── */
.modal-grid{display:grid;grid-template-columns:1fr;gap:18px}
#modal-box.has-impact{max-width:1000px}
@media (min-width:900px){
  #modal-box.has-impact .modal-grid{grid-template-columns:minmax(0,1fr) 300px}
  #impact-panel{position:sticky;top:0;align-self:start;max-height:80vh;overflow-y:auto}
}
#impact-panel{display:none;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
#modal-box.has-impact #impact-panel{display:block}
.imp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.imp-head .t{font-family:var(--font-display);font-size:13.5px;font-weight:800;color:var(--ink)}
.imp-live{font-size:10.5px;font-weight:800;color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--accent-border);border-radius:20px;padding:2px 9px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.imp-live .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:impPulse 1.6s infinite}
@keyframes impPulse{0%,100%{opacity:1}50%{opacity:.35}}
.imp-sub{font-size:11px;color:var(--faint);margin-bottom:12px;line-height:1.6}
.imp-party{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:12px 13px;margin-bottom:12px}
.imp-party .who{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
.imp-party .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.imp-party .now{font-family:var(--font-display);font-size:16px;font-weight:800;color:var(--ink)}
.imp-party .after{font-size:11px;color:var(--faint);margin-top:3px}
.imp-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--border);gap:10px}
.imp-row:last-of-type{border-bottom:none}
.imp-row .lbl{color:var(--ink-2);font-size:12.5px;font-weight:600}
.imp-row .lbl .imp-after{display:block;font-size:10.5px;color:var(--faint);font-weight:600;margin-top:2px}
.imp-badge{padding:4px 10px;border-radius:999px;font-weight:800;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums;transition:transform .18s var(--ease)}
.imp-up{background:var(--pos-soft);color:var(--pos)}
.imp-down{background:var(--neg-soft);color:var(--neg)}
.imp-flat{background:var(--surface);color:var(--faint);border:1px solid var(--border-strong)}
.imp-warn{background:var(--gold-soft);color:var(--gold-ink);border:1px solid var(--gold-border);border-radius:var(--r-sm);padding:9px 11px;font-size:11.5px;margin-top:12px;line-height:1.7}
.imp-warn.crit{background:var(--neg-soft);color:var(--neg);border-color:var(--neg-border)}
.imp-journal-h{font-size:11px;color:var(--faint);font-weight:700;margin:14px 0 6px}
.imp-journal{width:100%;border-collapse:collapse;font-size:12px}
.imp-journal th{color:var(--faint);font-weight:700;text-align:right;padding:4px 2px;font-size:10.5px}
.imp-journal td{padding:5px 2px;border-top:1px solid var(--border);color:var(--ink-2)}
.imp-journal tr.total td{border-top:1.5px solid var(--border-strong);font-weight:800;color:var(--ink)}
.imp-journal td.num{font-variant-numeric:tabular-nums;text-align:left}
.imp-placeholder{color:var(--faint);font-size:12.5px;text-align:center;padding:26px 10px;line-height:1.8}
.imp-mobile-strip{display:none}
@media (max-width:899px){
  #modal-box.has-impact .imp-mobile-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);
    border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px;margin-top:14px;font-size:12px;font-weight:700;cursor:pointer}
  #modal-box.has-impact .modal-grid #impact-panel{display:none}
  #modal-box.has-impact.imp-open .modal-grid #impact-panel{display:block;margin-top:14px}
}
.warn-box{background:var(--gold-soft);color:var(--gold-ink);border:1px solid var(--gold-border);border-radius:var(--r-sm);padding:11px 15px;font-size:13px;margin-bottom:13px}
.c-green{color:var(--pos)}.c-red{color:var(--neg)}.c-amber{color:var(--gold-ink)}
#file-import{display:none}

/* ── Save-state pill + theme toggle ────────────────────────────────────── */
#save-state{font-size:11px;padding:5px 11px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:all .2s var(--ease);cursor:default;font-weight:600;border:1px solid transparent}
#save-state.clean{background:var(--pos-soft);color:var(--pos);border-color:color-mix(in srgb,var(--pos) 20%,transparent)}
#save-state.dirty{background:var(--warn-soft);color:var(--warn);border-color:var(--gold-border)}
#save-state .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
#save-state.dirty .dot{animation:pulse 1.6s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.icon-btn{width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:16px;transition:all .18s var(--ease)}
.icon-btn:hover{background:var(--surface-2);border-color:var(--faint);transform:translateY(-1px)}

/* ── Validation ────────────────────────────────────────────────────────── */
.field-error{display:block;font-size:11px;color:var(--neg);margin-top:5px;line-height:1.5;font-weight:500}
.field input.invalid,.field select.invalid{border-color:var(--neg-border);background:var(--neg-soft)}
.field input.invalid:focus,.field select.invalid:focus{box-shadow:0 0 0 3px var(--neg-soft)}
.form-error-banner{background:var(--neg-soft);color:var(--neg);border:1px solid var(--neg-border);border-radius:var(--r-sm);padding:10px 13px;font-size:12px;margin-bottom:13px;line-height:1.6;font-weight:500}

/* ── AI Advisor (المستشار الذكي) ───────────────────────────────────────── */
.ai-wrap{display:flex;flex-direction:column;gap:14px}
.ai-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ai-ttl{font-size:13px;font-weight:600;color:var(--ink)}
.ai-sub{font-size:11.5px;color:var(--muted);line-height:1.7;margin-bottom:16px}
.ai-prov{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:18px}
.ai-prov-btn{text-align:right;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--r-md);padding:13px 15px;cursor:pointer;font-family:inherit;transition:background .16s var(--ease),border-color .16s var(--ease),transform .16s var(--ease)}
.ai-prov-btn:hover{border-color:var(--faint);transform:translateY(-1px)}
.ai-prov-btn.on{background:var(--accent-soft);border-color:var(--accent-border)}
.ai-prov-name{font-size:13.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:7px}

.ai-status.err{background:var(--neg-soft);color:var(--neg);border-color:var(--neg-border)}

.ai-scope{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.ai-check{display:flex;align-items:flex-start;gap:9px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;transition:background .14s var(--ease),border-color .14s var(--ease)}
.ai-check:hover{border-color:var(--faint-2)}

.ai-check input{margin:2px 0 0;accent-color:var(--accent);flex-shrink:0;width:15px;height:15px;cursor:pointer}

.ai-presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:9px}
.ai-preset{display:flex;align-items:center;gap:9px;text-align:right;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-md);padding:13px 15px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink-2);transition:background .16s var(--ease),border-color .16s var(--ease),transform .16s var(--ease),color .16s var(--ease)}
.ai-preset:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent-border);color:var(--accent-ink);transform:translateY(-1px)}
.ai-preset:disabled{opacity:.5;cursor:not-allowed}
.ai-preset .ic{font-size:16px;flex-shrink:0}
.ai-ta{width:100%;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:11px 13px;color:var(--ink);font-size:13px;font-family:inherit;outline:none;resize:vertical;min-height:70px;line-height:1.75;transition:border-color .16s var(--ease),box-shadow .16s var(--ease),background .16s var(--ease)}
.ai-ta:focus{border-color:var(--accent);box-shadow:var(--ring);background:var(--surface)}
.ai-ta::placeholder{color:var(--faint)}
.ai-pre{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;font-size:11px;line-height:1.65;max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:var(--ink-2);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;direction:ltr;text-align:left;margin-top:10px}
.ai-note{font-size:11.5px;color:var(--muted);line-height:1.8;background:var(--surface-2);border-radius:var(--r-sm);padding:11px 14px;margin-top:14px}

/* ── Deal-form sections: scale weights · discount · storage locations · quick-create ── */
#modal-box.wide:not(.has-impact){max-width:680px}

.readout{padding:9px 12px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--r-sm);font-size:13px;font-weight:700;color:var(--ink);min-height:41px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}

.cell2{line-height:1.35}
.cell2 .sub{display:block;font-size:10.5px;color:var(--faint);font-weight:500;margin-top:2px}
.link-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:7px;font-weight:700;background:var(--gold-soft);color:var(--gold-ink);border:1px solid var(--gold-border)}
.btn-xs{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .14s var(--ease)}

@media (max-width:860px){

/* Accessibility — visible keyboard focus (WCAG 2.4.7). Mouse clicks stay ring-free via :focus-visible. */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{
  outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}

<body>

<div id="sidebar">
  <div class="brand">
    <div class="brand-mark">ب</div>
    <div>
      <div class="brand-name">تجارة البلاستيك</div>
      <div class="brand-sub">إدارة الأعمال</div>
    </div>
  </div>
  <nav id="nav"></nav>
  <div class="sidebar-footer" id="sdate"></div>
</div>

<div id="main">
  <div id="topbar" role="banner">
    <h2 id="view-title" tabindex="-1">لوحة التحكم</h2>
    <div class="topbar-actions">
      <span id="save-state" class="clean" title="حالة الحفظ"><span class="dot"></span><span id="save-state-txt">محفوظ</span></span>
      <span id="file-status" style="display:none;font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:5px 11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title=""></span>
      <button class="btn-success" onclick="exportData()" title="حفظ البيانات (يحفظ في الملف المرتبط إن وُجد)">⬇ <span class="btn-label-full">حفظ</span></button>
      <button class="btn-ghost"   onclick="triggerImport()" title="فتح ملف JSON محفوظ وربطه">⬆ <span class="btn-label-full">تحميل</span></button>
      <button class="btn-danger"  onclick="confirmClear()" title="مسح جميع البيانات">✕ <span class="btn-label-full">مسح</span></button>
      <button class="icon-btn" id="theme-toggle" onclick="toggleTheme()" title="تبديل المظهر (فاتح / داكن)" aria-label="تبديل المظهر">🌙</button>
      <input type="file" id="file-import" accept=".json" onchange="importData(event)">
    </div>
  </div>
  <div id="content" role="main"></div>
</div>

<div id="modal-overlay">
  <div id="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" onclick="closeModal()" aria-label="إغلاق">✕</button>
    </div>
    <div class="modal-grid">
      <div id="modal-body"></div>
      <aside id="impact-panel" aria-live="polite" aria-label="لوحة التأثير المباشر"></aside>
    </div>
    <div class="imp-mobile-strip" id="impact-strip" aria-live="polite" onclick="document.getElementById('modal-box').classList.toggle('imp-open')"></div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn-primary" id="save-btn" onclick="saveModal()">حفظ</button>
    </div>
  </div>
</div>

<div id="confirm-overlay">
  <div id="confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-msg">
    <h3 id="confirm-title"></h3>
    <p id="confirm-msg"></p>
    <div class="confirm-btns">
      <button class="btn-ghost" onclick="closeConfirm()">إلغاء</button>
      <button id="confirm-ok" class="btn-danger">تأكيد</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button id="toast-undo" class="toast-undo">↩ تراجع</button></div>

<script>
const UNITS        = ['طن','كيلوجرام','حبة'];
const EXP_CATS     = ['إيجار','نقل','عمالة','كهرباء ومياه','صيانة','متفرقات'];
const DEFAULT_MATS = ['HDPE','LDPE','PP','PET','PVC','PS','مواد مختلطة'];

let _uid = 100;
const uid   = () => ++_uid;
const today = () => new Date().toISOString().split('T')[0];
const fmt   = n  => `${Number(n||0).toLocaleString('ar-EG')} ج.م`;
// esc: escape user-supplied text before it is placed into innerHTML (prevents HTML/JS injection)
const esc   = s  => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// num: coerce any value to a finite number (0 when NaN/Infinity) — used for safe compute & import sanitization
const num   = v  => { const n = typeof v==='number'?v:parseFloat(v); return Number.isFinite(n)?n:0; };

// ── Deal maths — ONE source of truth for scale weights, discounts & money ─────────
//   qty       = الوزن المتعاقد عليه / المفوتر (contract / invoice weight)
//   actualQty = الوزن الفعلي على الميزان — optional; empty ⇒ same as the contract weight
//   billOn    = 'contract' | 'actual' — which of the two weights the money follows
//   discount  = خصم / تقريب بالجنيه — stored apart from the base deal value, for review
// Stock always moves by the PHYSICAL (scale) weight, so a scale overweight on a purchase
// can never surface later as an unexplained shortfall ("عجز") when the goods are sold.
const fq        = v => +num(v).toFixed(3);                              // tidy a derived qty (0.1+0.2 → 0.3)
const hasActual = r => !!r && r.actualQty!=null && r.actualQty!=='' && num(r.actualQty)>0;
const aQty      = r => hasActual(r) ? num(r.actualQty) : num(r && r.qty);   // physical weight → drives stock
const wDiff     = r => hasActual(r) ? fq(num(r.actualQty)-num(r.qty)) : 0; // + زيادة فعلية / − فاقد
const billQty   = r => (r && r.billOn==='actual') ? aQty(r) : num(r && r.qty);
const grossAmt  = r => billQty(r)*num(r && r.price);                    // قيمة الصفقة الأساسية (قبل الخصم)
const discAmt   = r => Math.max(0, num(r && r.discount));
const netAmt    = r => grossAmt(r) - discAmt(r);                        // صافي الصفقة = what is actually owed
const netIn     = p => fq(aQty(p) - num(p && p.waste));                 // sellable stock a purchase brings in
const txSum     = r => ((r && r.txExpenses) || []).reduce((a,e)=>a+num(e.amount),0);
// Storage locations: a purchase splits its stock over [{loc, sub, qty, desc}]; a sale may record
// where it was drawn from [{loc, sub, qty}]. Balances per material+location are derived live.
const LOC_SEP   = '\u0001';
const locKey    = (loc,sub) => `${loc||''}${LOC_SEP}${sub||''}`;
const locName   = (loc,sub) => `${loc||'—'}${sub?' › '+sub:''}`;
function cleanLocs(rows){
  return (Array.isArray(rows)?rows:[]).filter(r=>r && typeof r==='object')
    .map(r=>({loc:String(r.loc==null?'':r.loc).trim(), sub:String(r.sub==null?'':r.sub).trim(),
              qty:num(r.qty), desc:String(r.desc==null?'':r.desc).trim()}))
    .filter(r=>r.qty>0 && (r.loc||r.sub));
}
// Party codes + supplier↔customer link (one entity playing both roles). The link lives on
// the supplier record only (linkedCustomerId) so it can never disagree with itself.
const sCode = id => `م-${id}`;
const cCode = id => `ع-${id}`;
const _normName = s => String(s==null?'':s).trim().replace(/\s+/g,' ').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase();

let DB = {
  view:'dashboard', cTab:'suppliers', modal:null, form:{}, newMat:'',
  invTab:'material', invQ:'', invShowEmpty:false,   // inventory screen UI state — never saved
  plFrom:'', plTo:'',            // P&L period filter — UI state only, never written to the JSON file
  suppliers:[], customers:[], purchases:[], sales:[], expenses:[],
  materials:[...DEFAULT_MATS],
  capital:0,
  traderAdvances:[],
  workerLiquidity:[],
  closings:[],
  collections:[],
  supplierPayments:[],
  partners:[],
  distributions:[]
};

// ── Local autosave & dirty tracking ───────────────────────────────────────────
// Safety net: every change is mirrored to localStorage so unsaved work survives a
// reload/refresh/crash. The JSON file (via ⬇ حفظ) remains the user's durable backup.
const LS_KEY = 'plastic_manager_autosave';
let _dirty = false;

function updateSaveState(){
  const el = document.getElementById('save-state');
  if(!el) return;
  const txt = document.getElementById('save-state-txt');
  if(_dirty){
    el.className='dirty';
    if(txt) txt.textContent='تغييرات غير محفوظة';
    el.title='لديك تغييرات لم تُصدَّر إلى ملف. البيانات محفوظة تلقائياً داخل المتصفح — اضغط ⬇ حفظ لحفظ نسخة في ملف.';
  } else {
    el.className='clean';
    if(txt) txt.textContent='محفوظ';
    el.title='كل التغييرات محفوظة تلقائياً.';
  }
}
function persistLocal(){
  try { localStorage.setItem(LS_KEY, JSON.stringify({dirty:_dirty, data:buildPayload()})); }
  catch(e){ /* storage full or disabled — the file export still works */ }
}
// markDirty: call after ANY change to business data. Persists immediately (these are
// discrete actions, not keystrokes) so nothing is lost even if the tab closes at once.
function markDirty(){ _dirty = true; updateSaveState(); persistLocal(); }
// markClean: after a successful export to the JSON file
function markClean(){ _dirty = false; updateSaveState(); persistLocal(); }
function restoreLocal(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const saved = JSON.parse(raw);
    if(!saved || !saved.data) return false;
    if(loadJsonText(JSON.stringify(saved.data), null, {silent:true})){
      _dirty = !!saved.dirty; updateSaveState();
      return true;
    }
  } catch(e){}
  return false;
}

// ── Generalized confirmation dialog ───────────────────────────────────────────
let _confirmCb = null, _confirmReturnFocus = null;

// ── JSON Export / Import ──────────────────────────────────────────────────────
// _fileHandle: FileSystemFileHandle linked to the user's save file. Once set,
// every "حفظ" writes back to this same file with no re-prompt. Persisted in
// IndexedDB so the link survives page reloads.
let _fileHandle = null;
const FS_SUPPORTED = typeof window.showSaveFilePicker === 'function';

function _idbOpen() {
  return new Promise((res,rej)=>{
    const r = indexedDB.open('plastic_manager',1);
    r.onupgradeneeded = () => r.result.createObjectStore('handles');
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}
async function _idbSetHandle(h) {
  try {
    const db = await _idbOpen();
    return new Promise(res=>{
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').put(h,'current');
      tx.oncomplete = () => res();
      tx.onerror    = () => res();
    });
  } catch {}
}
async function _idbGetHandle() {
  try {
    const db = await _idbOpen();
    return new Promise(res=>{
      const tx = db.transaction('handles','readonly');
      const r  = tx.objectStore('handles').get('current');
      r.onsuccess = () => res(r.result || null);
      r.onerror   = () => res(null);
    });
  } catch { return null; }
}
async function _idbClearHandle() {
  try {
    const db = await _idbOpen();
    return new Promise(res=>{
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').delete('current');
      tx.oncomplete = () => res();
      tx.onerror    = () => res();
    });
  } catch {}
}
async function _ensurePerm(h,mode){
  if (!h) return false;
  const opts = {mode};
  if ((await h.queryPermission(opts))   === 'granted') return true;
  if ((await h.requestPermission(opts)) === 'granted') return true;
  return false;
}
function updateFileStatus() {
  const el = document.getElementById('file-status');
  if (!el) return;
  if (_fileHandle) {
    el.style.display = 'inline-flex';
    el.style.alignItems = 'center';
    el.style.gap = '4px';
    el.title = `الملف المرتبط: ${_fileHandle.name} — اضغط × لإلغاء الربط`;
    el.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px">📎 ${esc(_fileHandle.name)}</span><button id="file-unlink" title="إلغاء الربط" style="background:none;border:none;cursor:pointer;color:var(--faint);font-size:13px;padding:0 2px;line-height:1">✕</button>`;
    document.getElementById('file-unlink').onclick = unlinkFile;
  } else {
    el.style.display = 'none';
    el.innerHTML = '';
  }
}
async function unlinkFile() {
  _fileHandle = null;
  await _idbClearHandle();
  updateFileStatus();
  showToast('✓ تم إلغاء ربط الملف');
}

function buildPayload() {
  return {
    version: 2,        // v2: scale weights, deal discounts, storage locations, supplier↔customer links
    savedAt: new Date().toISOString(),
    suppliers: DB.suppliers,
    customers: DB.customers,
    purchases: DB.purchases,
    sales:     DB.sales,
    expenses:  DB.expenses,
    materials: DB.materials,
    capital:        DB.capital,
    traderAdvances: DB.traderAdvances,
    workerLiquidity:DB.workerLiquidity,
    closings:       DB.closings,
    collections:    DB.collections,
    supplierPayments: DB.supplierPayments,
    partners:       DB.partners,
    distributions:  DB.distributions,
  };
}

function _downloadJson(json) {
  const blob = new Blob([json], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `plastic_data_${new Date().toLocaleDateString('en-CA')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✓ تم تنزيل البيانات');
}

async function exportData() {
  const json = JSON.stringify(buildPayload(), null, 2);
  if (FS_SUPPORTED) {
    try {
      if (!_fileHandle) {
        _fileHandle = await window.showSaveFilePicker({
          suggestedName: `plastic_data_${new Date().toLocaleDateString('en-CA')}.json`,
          types: [{description:'JSON', accept:{'application/json':['.json']}}],
        });
        await _idbSetHandle(_fileHandle);
        updateFileStatus();
      }
      if (!(await _ensurePerm(_fileHandle,'readwrite'))) {
        showToast('⚠ لا توجد صلاحية كتابة على الملف');
        return;
      }
      const w = await _fileHandle.createWritable();
      await w.write(json);
      await w.close();
      markClean();
      showToast(`✓ تم الحفظ — ${_fileHandle.name}`);
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;   // user cancelled the picker
      console.error('Save failed, falling back to download:', err);
    }
  }
  _downloadJson(json);
  markClean();
}

// _sanitizeData: harden an imported file so nothing downstream can crash or poison the maths.
//   1) drop null / non-object records from every array (a stray `null` used to throw in computed())
//   2) coerce numeric fields to finite numbers (qty:"ten" → 0, never NaN/Infinity)
// Records already holding valid objects & numbers are unchanged, so existing saved files load identically.
function _sanitizeData(d){
  const RECORD_ARRAYS = ['suppliers','customers','purchases','sales','expenses','traderAdvances',
                         'workerLiquidity','closings','collections','supplierPayments','partners','distributions'];
  RECORD_ARRAYS.forEach(k=>{
    d[k] = Array.isArray(d[k]) ? d[k].filter(r => r && typeof r === 'object') : [];
  });
  if(!Array.isArray(d.materials)) d.materials = [];
  else d.materials = d.materials.filter(m => typeof m === 'string');
  const fixTx = r => { r.txExpenses = Array.isArray(r.txExpenses)
    ? r.txExpenses.filter(e=>e&&typeof e==='object').map(e=>({...e, amount:num(e.amount)})) : []; };
  // Scale weight / billing basis / discount — absent on older files, defaulted so old files load identically
  const fixDeal = r => {
    r.actualQty = (r.actualQty==null || r.actualQty==='' || !(num(r.actualQty)>0)) ? null : num(r.actualQty);
    r.billOn = (r.billOn==='actual' && r.actualQty!=null) ? 'actual' : 'contract';
    r.discount = Math.max(0, num(r.discount));
    r.discountPct = (r.discountPct==null || r.discountPct==='' || !(r.discount>0)) ? null : num(r.discountPct);
    r.discountNote = typeof r.discountNote==='string' ? r.discountNote : '';
  };
  d.purchases.forEach(r=>{ r.qty=num(r.qty); r.price=num(r.price); r.paid=num(r.paid); r.waste=num(r.waste); fixTx(r); fixDeal(r); r.locations=cleanLocs(r.locations); });
  d.sales.forEach(r=>{ r.qty=num(r.qty); r.price=num(r.price); r.paid=num(r.paid); fixTx(r); fixDeal(r); r.fromLocations=cleanLocs(r.fromLocations).map(({loc,sub,qty})=>({loc,sub,qty})); });
  d.suppliers.forEach(r=>{ if(r.linkedCustomerId==='' || r.linkedCustomerId===undefined) r.linkedCustomerId=null; });
  d.expenses.forEach(r=> r.amount=num(r.amount));
  d.collections.forEach(r=> r.amount=num(r.amount));
  d.supplierPayments.forEach(r=> r.amount=num(r.amount));
  d.traderAdvances.forEach(r=> r.amount=num(r.amount));
  d.workerLiquidity.forEach(r=> r.amount=num(r.amount));
  d.partners.forEach(r=> r.sharePct=num(r.sharePct));
  d.distributions.forEach(r=>{ r.amount=num(r.amount);
    r.breakdown = Array.isArray(r.breakdown)
      ? r.breakdown.filter(b=>b&&typeof b==='object').map(b=>({...b, gross:num(b.gross), drawsAbsorbed:num(b.drawsAbsorbed), net:num(b.net)})) : []; });
  d.closings.forEach(r=>{ r.net=num(r.net); r.cash=num(r.cash); });
  d.capital = num(d.capital);
  return d;
}

function loadJsonText(text, source, opts={}) {
  const silent = !!opts.silent;
  try {
    const d = _sanitizeData(JSON.parse(text));
    if (!Array.isArray(d.suppliers) || !Array.isArray(d.purchases)) {
      if(!silent) showToast('✗ الملف غير صالح'); return false;
    }
    DB.suppliers = d.suppliers || [];
    DB.customers = d.customers || [];
    DB.purchases = d.purchases || [];
    DB.sales     = d.sales     || [];
    DB.expenses  = d.expenses  || [];
    DB.materials = d.materials && d.materials.length ? d.materials : [...DEFAULT_MATS];
    DB.capital         = d.capital         || 0;
    DB.traderAdvances  = d.traderAdvances  || [];
    DB.workerLiquidity = d.workerLiquidity || [];
    DB.closings        = d.closings        || [];
    DB.collections     = d.collections     || [];
    DB.supplierPayments= d.supplierPayments|| [];
    DB.partners        = d.partners        || [];
    DB.distributions   = d.distributions   || [];
    const allIds = [...DB.suppliers,...DB.customers,...DB.purchases,...DB.sales,...DB.expenses,...DB.traderAdvances,...DB.workerLiquidity,...DB.collections,...DB.supplierPayments,...DB.partners,...DB.distributions].map(x=>(x&&x.id)||0);
    if (allIds.length) _uid = Math.max(_uid, ...allIds) + 1;
    DB.view = 'dashboard';
    render();
    if(!silent){
      _dirty = false; updateSaveState(); persistLocal();   // freshly loaded from a file = saved
      const savedAt = d.savedAt ? ' — ' + new Date(d.savedAt).toLocaleDateString('ar-EG') : '';
      showToast('✓ تم تحميل البيانات بنجاح' + (source?` — ${source}`:'') + savedAt);
    }
    return true;
  } catch { if(!silent) showToast('✗ خطأ في قراءة الملف'); return false; }
}

async function triggerImport() {
  if (FS_SUPPORTED && typeof window.showOpenFilePicker === 'function') {

        types: [{description:'JSON', accept:{'application/json':['.json']}}],

      if (loadJsonText(text, h.name)) {
        _fileHandle = h;

      if (err && err.name === 'AbortError') return;

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => loadJsonText(ev.target.result, file.name);
  reader.readAsText(file);
  e.target.value = '';
}

// On startup, restore the previously linked file handle. Auto-load its content ONLY
// when there was no local autosave to restore — the localStorage copy is always the
// freshest (it captures unsaved edits), so we must not clobber it with the file.
async function _restoreLinkedFile(skipAutoLoad) {
  if (!FS_SUPPORTED) return;
  const h = await _idbGetHandle();
  if (!h) return;
  _fileHandle = h;
  updateFileStatus();
  if (skipAutoLoad) return;
  try {
    // Only auto-load if permission is already granted (don't prompt on every page load)
    if ((await h.queryPermission({mode:'read'})) === 'granted') {
      const file = await h.getFile();
      const text = await file.text();
      loadJsonText(text, h.name);
    }
  } catch (err) { console.error('Auto-load failed:', err); }
}

let _toastTimer;

// confirmDeleteRecord: for money records (purchases / sales) we ask first AND still offer undo.
// Deleting one moves real money and can orphan linked records, so a deliberate pause is warranted.
function confirmDeleteRecord(key, id, label, detail) {
  showConfirm({
    title: `حذف ${label}`,
    message: detail,
    confirmLabel: 'حذف',
    danger: true,
    onConfirm: () => deleteWithUndo(key, id, label)
  });
}

// deleteWithUndo: removes a record and offers an undo that restores it at its ORIGINAL index —
// position matters because deal numbers (#001…) are derived from array order.
function deleteWithUndo(key, id, label) {
  const arr = DB[key];
  const idx = arr.findIndex(x => x.id === id);
  if (idx < 0) return;
  const rec = arr[idx];
  DB[key] = arr.filter(x => x.id !== id);
  markDirty(); render();
  showUndoToast(`✓ تم حذف ${label}`, () => {
    const a = DB[key].slice();
    a.splice(Math.min(idx, a.length), 0, rec);   // put it back exactly where it was
    DB[key] = a;
    markDirty(); render();
    showToast('↩ تم التراجع — تمت استعادة السجل');
  });
}

// ── Computed ──────────────────────────────────────────────────────────────────
// Accounting model (weighted-average cost / AVCO):
//   • avgCost(material) = total purchase cost of that material ÷ net (sellable) qty purchased
//   • COGS  = Σ sold qty × avgCost      → only goods actually SOLD are expensed
//   • inventoryValue = remaining stock × avgCost  → unsold goods are carried as an asset
//   • gross = revenue − COGS ; net = gross − operating & deal expenses
// This makes "صافي الربح" a real profit figure and keeps COGS + inventoryValue = totalCost.
//   • Money follows netAmt() (billed weight × price − discount); stock follows aQty() (scale weight).
//     A purchase overweight therefore enters stock at no extra cost and lowers the average cost.
function computed(db=DB) {
  const P=db.purchases, S=db.sales;
  const totalCostGross = P.reduce((s,p)=>s+grossAmt(p),0);
  const totalDiscP  = P.reduce((s,p)=>s+discAmt(p),0);
  const totalCost   = totalCostGross - totalDiscP;          // net cost of ALL purchased goods (after discounts)
  const totalRevGross = S.reduce((s,p)=>s+grossAmt(p),0);
  const totalDiscS  = S.reduce((s,p)=>s+discAmt(p),0);
  const totalRev    = totalRevGross - totalDiscS;           // net sales revenue (after discounts)
  const totalExp    = db.expenses.reduce((s,e)=>s+num(e.amount),0);
  const txExpP      = P.reduce((s,p)=>s+txSum(p),0);
  const txExpS      = S.reduce((s,p)=>s+txSum(p),0);
  const totalTxExp  = txExpP + txExpS;
  const totalWaste  = P.reduce((s,p)=>s+num(p.waste),0);
  // Material universe = defined materials ∪ any referenced by a transaction (robust to unknown materials)
  const mats=[...new Set([...db.materials, ...P.map(p=>p.material), ...S.map(s=>s.material)])].filter(m=>m!=null&&m!=='');
  const inv={}; mats.forEach(m=>inv[m]={in:0,out:0,waste:0,cost:0,contractIn:0,overIn:0,overOut:0,unit:'طن',colors:new Set()});
  P.forEach(p=>{const g=inv[p.material]; if(!g)return; g.in+=aQty(p); g.contractIn+=num(p.qty); g.overIn+=wDiff(p); g.waste+=num(p.waste); g.cost+=netAmt(p); g.unit=p.unit||g.unit; if(p.color)g.colors.add(p.color);});
  S.forEach(s=>{const g=inv[s.material]; if(!g)return; g.out+=aQty(s); g.overOut+=wDiff(s); if(s.color)g.colors.add(s.color);});
  const avgCost=m=>{const g=inv[m]; if(!g)return 0; const net=g.in-g.waste; return net>0?g.cost/net:0;};
  let cogs=0, inventoryValue=0;
  const invRows=mats.map(m=>{
    const g=inv[m]; const net=g.in-g.waste; const stock=fq(net-g.out); const ac=avgCost(m);
    cogs+=g.out*ac;
    if(stock>0) inventoryValue+=stock*ac;
    return {m,in:fq(g.in),out:fq(g.out),waste:fq(g.waste),stock,unit:g.unit,colors:[...g.colors],avgCost:ac,value:Math.max(0,stock)*ac,
            contractIn:fq(g.contractIn),overIn:fq(g.overIn),overOut:fq(g.overOut)};
  }).filter(r=>r.in>0||r.out>0||r.waste>0);
  cogs=+cogs.toFixed(2); inventoryValue=+inventoryValue.toFixed(2);
  const gross = totalRev - cogs;
  const net   = gross - totalExp - totalTxExp;
  const totalDistributed = db.distributions.reduce((s,d)=>s+num(d.amount),0);
  return {totalCost,totalCostGross,totalDiscP,cogs,totalRev,totalRevGross,totalDiscS,totalExp,totalTxExp,totalWaste,gross,net,invRows,inventoryValue,totalDistributed};
}

// computedCash: the cash / receivables / payables side of the books.
// Extracted so the Balance screen and the AI snapshot can never drift apart.
// db: an alternate ledger snapshot (used by the live impact preview) — defaults to the real DB.
function computedCash(db=DB){
  const {totalTxExp, inventoryValue, net, totalDistributed} = computed(db);
  const cashIn      = db.sales.reduce((s,r)=>s+num(r.paid),0);
  const collIn      = db.collections.reduce((s,r)=>s+num(r.amount),0);
  const cashOutBuy  = db.purchases.reduce((s,r)=>s+num(r.paid),0);
  const suppPaid    = db.supplierPayments.reduce((s,r)=>s+num(r.amount),0);
  const cashOutExp  = db.expenses.reduce((s,r)=>s+num(r.amount),0)+totalTxExp;
  const traderOut   = db.traderAdvances.filter(a=>!a.settled).reduce((s,a)=>s+num(a.amount),0);
  const workerOut   = db.workerLiquidity.filter(w=>!w.returned&&!w.partnerId).reduce((s,w)=>s+num(w.amount),0);
  const partnerDrawsOut = partnerDrawsTotal(db);
  const cashBalance = db.capital + cashIn + collIn - cashOutBuy - suppPaid - cashOutExp - traderOut - workerOut - partnerDrawsOut - totalDistributed;
  // Receivables / Payables (net of all payments including standalone)
  const receivable  = db.sales.reduce((s,r)=>s+(netAmt(r)-num(r.paid)),0) - collIn;
  const payable     = db.purchases.reduce((s,r)=>s+(netAmt(r)-num(r.paid)),0) - suppPaid;
  return {cashIn,collIn,cashOutBuy,suppPaid,cashOutExp,traderOut,workerOut,partnerDrawsOut,
          cashBalance,receivable,payable,invValue:inventoryValue,
          equity:db.capital+net-totalDistributed,totalDistributed};
}

// computedPL: profit & loss for an optional [from,to] date window (inclusive, 'YYYY-MM-DD').
// Costing rule: sales are valued at the weighted-average cost of every purchase made UP TO `to`,
// so purchases made after the window never retroactively re-price earlier sales, while stock
// bought before the window (opening inventory) is still costed correctly.
// With no window this is mathematically identical to computed() — the all-time figures.
function computedPL(from, to){
  const inRange = d => (!from || (d && d >= from)) && (!to || (d && d <= to));
  const P=DB.purchases, S=DB.sales;
  const acc={};
  P.forEach(p=>{
    if(to && p.date && p.date > to) return;          // ignore purchases after the window
    const m=p.material; if(m==null||m==='') return;
    if(!acc[m]) acc[m]={cost:0,net:0};
    acc[m].cost += netAmt(p);                 // purchase discounts lower the cost of goods
    acc[m].net  += aQty(p)-num(p.waste);      // stock is costed on the scale (physical) weight
  });
  const avg = m => { const g=acc[m]; return (g && g.net>0) ? g.cost/g.net : 0; };
  const salesIn = S.filter(s=>inRange(s.date));
  const purchIn = P.filter(p=>inRange(p.date));
  const expIn   = DB.expenses.filter(e=>inRange(e.date));
  const totalRevGross = salesIn.reduce((a,s)=>a+grossAmt(s),0);
  const discS      = salesIn.reduce((a,s)=>a+discAmt(s),0);
  const discP      = purchIn.reduce((a,p)=>a+discAmt(p),0);
  const totalRev   = totalRevGross - discS;
  const cogs       = +salesIn.reduce((a,s)=>a+aQty(s)*avg(s.material),0).toFixed(2);
  const totalExp   = expIn.reduce((a,e)=>a+num(e.amount),0);
  const totalTxExp = [...purchIn,...salesIn].reduce((a,r)=>a+txSum(r),0);
  const gross = totalRev - cogs;
  const net   = gross - totalExp - totalTxExp;
  return {totalRev,totalRevGross,discS,discP,cogs,totalExp,totalTxExp,gross,net,
          counts:{sales:salesIn.length, purchases:purchIn.length, expenses:expIn.length}};
}

const supplierOfCustomer = cid => DB.suppliers.find(s=>s.linkedCustomerId!=null && s.linkedCustomerId!=='' && s.linkedCustomerId==cid && DB.customers.some(c=>c.id==cid)) || null;

// locBalances: stock per material × storage location (in from purchase splits, out from sale draws)
function locBalances(){
  const map={};
  const touch=(m,l,unit)=>{ const k=m+LOC_SEP+locKey(l.loc,l.sub);
    return map[k] || (map[k]={material:m,loc:l.loc,sub:l.sub,unit:unit||'طن',in:0,out:0,descs:new Set(),deals:new Set()}); };
  DB.purchases.forEach((p,idx)=>(p.locations||[]).forEach(l=>{ const g=touch(p.material,l,p.unit); g.in+=num(l.qty); if(l.desc)g.descs.add(l.desc); g.deals.add(idx+1); if(p.unit)g.unit=p.unit; }));
  DB.sales.forEach(s=>(s.fromLocations||[]).forEach(l=>{ const g=touch(s.material,l,s.unit); g.out+=num(l.qty); }));
  return Object.values(map).map(g=>({...g,in:fq(g.in),out:fq(g.out),bal:fq(g.in-g.out),descs:[...g.descs],deals:[...g.deals].sort((a,b)=>a-b)}));
}
// Locations a sale of `material` can draw from (a sale being edited gets its own draws back first)
function locOptionsFor(material, editSaleId){
  const bals=locBalances().filter(b=>b.material===material);
  const own=editSaleId ? DB.sales.find(s=>s.id===editSaleId) : null;
  if(own && own.material===material) (own.fromLocations||[]).forEach(l=>{
    const b=bals.find(x=>x.loc===l.loc && x.sub===l.sub); if(b) b.bal=fq(b.bal+num(l.qty)); });
  return bals.filter(b=>b.bal>0.0005);
}
function knownLocations(){
  const locs=new Set(), subs=new Set();
  [...DB.purchases.flatMap(p=>p.locations||[]), ...DB.sales.flatMap(s=>s.fromLocations||[])]
    .forEach(l=>{ if(l.loc)locs.add(l.loc); if(l.sub)subs.add(l.sub); });
  const srt=a=>[...a].sort((x,y)=>x.localeCompare(y,'ar'));
  return {locs:srt(locs), subs:srt(subs)};
}
// partnerDraws: cash a partner already withdrew (linked workerLiquidity, unreturned) minus
// what past distributions have already absorbed against their share — computed live from
// raw records so nothing needs to be mutated when a distribution partially/fully absorbs it.
function partnerDraws(partnerId,excludeDistId,db=DB){
  const raw = db.workerLiquidity.filter(w=>w.partnerId==partnerId && !w.returned).reduce((s,w)=>s+w.amount,0);
  const absorbed = db.distributions.filter(d=>d.id!==excludeDistId).reduce((s,d)=>{
    const b=(d.breakdown||[]).find(x=>x.partnerId==partnerId);
    return s+(b?.drawsAbsorbed||0);
  },0);
  return Math.max(0,raw-absorbed);
}
const partnerDrawsTotal = (db=DB) => db.partners.reduce((s,p)=>s+partnerDraws(p.id,undefined,db),0);

function el(tag,attrs={},inner=''){
  const e=document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='cls')e.className=v;
    else if(k==='style')e.style.cssText=v;
    else e.setAttribute(k,v);
  });
  if(typeof inner==='string')e.innerHTML=inner;
  else if(Array.isArray(inner))inner.forEach(c=>c&&e.appendChild(c));
  else if(inner instanceof Node)e.appendChild(inner);
  return e;
}

// _buildRow: one <tr> for a record (shared by the plain + interactive table paths)
function _buildRow(cols,r,onDel,onEdit){
  const tr=el('tr');
  cols.forEach(c=>{
    const td=el('td');
    if(c.render){const v=c.render(r);if(typeof v==='string')td.innerHTML=v;else td.appendChild(v);}
    else td.textContent=r[c.key]||'';
    tr.appendChild(td);
  });
  if(onDel||onEdit){
    const td=el('td',{style:'white-space:nowrap'});
    if(onEdit){const btn=el('button',{style:'background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 5px;border-radius:4px',title:'تعديل'},'✎');btn.onclick=()=>onEdit(r);td.appendChild(btn);}
    // Delete is instant + undoable (see deleteWithUndo) — onDel owns the whole flow.
    if(onDel){const btn=el('button',{cls:'del-btn',title:'حذف'},'✕');btn.onclick=()=>onDel(r.id);td.appendChild(btn);}
    tr.appendChild(td);
  }
  return tr;
}

// Per-table UI state (search query, sort column/direction, page) — persists across re-renders,
// keyed by opts.stateKey. UI-only; never written to the saved JSON file.
let _tableUI = {};

// makeTable — plain by default; pass opts.stateKey + (searchText | sort | pageSize) to enable
// an interactive table (search box, click-to-sort headers, pagination). The search input rebuilds
// only the <tbody>, so typing never loses focus.
function makeTable(cols,rows,onDel,onEdit,opts={}){
  const emptyMsg='لا توجد بيانات — اضغط "+ إضافة" للبدء';
  const colspan=String(cols.length+((onDel||onEdit)?1:0));
  const interactive = opts.stateKey && (opts.searchText || opts.sort || opts.pageSize);

  if(!interactive){
    const wrap=el('div',{cls:'tbl-wrap'}),tbl=el('table'),thead=el('thead'),hrow=el('tr');
    cols.forEach(c=>hrow.appendChild(el('th',{scope:'col'},c.label)));
    if(onDel||onEdit)hrow.appendChild(el('th',{style:'width:60px','aria-label':'إجراءات'},''));
    thead.appendChild(hrow);
    const tbody=el('tbody');
    if(!rows.length){const tr=el('tr',{cls:'empty-row'});tr.appendChild(el('td',{colspan},emptyMsg));tbody.appendChild(tr);}
    rows.forEach(r=>tbody.appendChild(_buildRow(cols,r,onDel,onEdit)));
    tbl.appendChild(thead);tbl.appendChild(tbody);wrap.appendChild(tbl);
    return wrap;
  }

  const st = _tableUI[opts.stateKey] || (_tableUI[opts.stateKey]={q:'',sortKey:null,sortDir:1,page:0});
  const outer=el('div');

  // ── toolbar: search box + result count ──
  let countEl=null;
  if(opts.searchText){
    const bar=el('div',{cls:'tbl-toolbar'});
    const si=document.createElement('input');
    si.type='search'; si.className='tbl-search'; si.value=st.q;
    si.placeholder=opts.searchPlaceholder||'🔎 بحث…'; si.setAttribute('aria-label','بحث في الجدول');
    si.oninput=()=>{ st.q=si.value; st.page=0; refresh(); };
    bar.appendChild(si);
    countEl=el('span',{cls:'tbl-count'}); bar.appendChild(countEl);
    outer.appendChild(bar);
  }

  // ── table with sortable headers ──
  const wrap=el('div',{cls:'tbl-wrap'}),tbl=el('table'),thead=el('thead'),hrow=el('tr');
  cols.forEach(c=>{
    const sortable = opts.sort && (c.sortVal || (rows[0] && c.key in rows[0]));
    const th=el('th',{scope:'col'});
    th.appendChild(document.createTextNode(c.label));
    const arrow=el('span',{cls:'sort-arrow'}); th.appendChild(arrow);
    th._col=c; th._arrow=arrow; th._sortable=sortable;
    if(sortable){
      th.className='th-sort'; th.tabIndex=0; th.setAttribute('role','button');
      const doSort=()=>{ if(st.sortKey===c.key) st.sortDir*=-1; else { st.sortKey=c.key; st.sortDir=1; } refresh(); };
      th.onclick=doSort;
      th.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); doSort(); } };
    }
    hrow.appendChild(th);
  });
  if(onDel||onEdit)hrow.appendChild(el('th',{style:'width:60px','aria-label':'إجراءات'},''));
  thead.appendChild(hrow);
  const tbody=el('tbody');
  tbl.appendChild(thead);tbl.appendChild(tbody);wrap.appendChild(tbl);outer.appendChild(wrap);
  const pager = opts.pageSize ? el('div',{cls:'tbl-pager'}) : null;
  if(pager) outer.appendChild(pager);

  function view(){
    let rs=rows.slice();
    if(opts.searchText && st.q.trim()){
      const q=st.q.trim().toLowerCase();
      rs=rs.filter(r=>String(opts.searchText(r)).toLowerCase().includes(q));
    }
    if(st.sortKey){
      const col=cols.find(c=>c.key===st.sortKey);
      const val=r=> col&&col.sortVal ? col.sortVal(r) : (col ? r[col.key] : '');
      rs.sort((a,b)=>{ const x=val(a),y=val(b);
        if(typeof x==='number' && typeof y==='number') return (x-y)*st.sortDir;
        return String(x==null?'':x).localeCompare(String(y==null?'':y),'ar')*st.sortDir; });
    }
    return rs;
  }

  function refresh(){
    const all=view(), total=all.length;
    let pageRows=all, pages=1;
    if(opts.pageSize){
      pages=Math.max(1,Math.ceil(total/opts.pageSize));
      st.page=Math.min(Math.max(0,st.page),pages-1);
      pageRows=all.slice(st.page*opts.pageSize,(st.page+1)*opts.pageSize);
    }
    tbody.innerHTML='';
    if(!pageRows.length){
      const tr=el('tr',{cls:'empty-row'});
      tr.appendChild(el('td',{colspan}, st.q.trim()?'لا نتائج مطابقة للبحث':emptyMsg));
      tbody.appendChild(tr);
    } else pageRows.forEach(r=>tbody.appendChild(_buildRow(cols,r,onDel,onEdit)));
    // header sort indicators
    [...hrow.children].forEach(th=>{ if(!th._col) return;
      const on = st.sortKey===th._col.key;
      th._arrow.textContent = on ? (st.sortDir>0?' ▲':' ▼') : (th._sortable?' ⇅':'');
      if(th._sortable) th.setAttribute('aria-sort', on?(st.sortDir>0?'ascending':'descending'):'none');
    });
    if(countEl) countEl.textContent = st.q.trim()? `${total} نتيجة` : `${total} سجل`;
    if(pager){
      pager.innerHTML='';
      if(pages>1){
        const prev=el('button',{cls:'pager-btn'},'‹ السابق');
        const next=el('button',{cls:'pager-btn'},'التالي ›');
        prev.disabled=st.page<=0; next.disabled=st.page>=pages-1;
        prev.onclick=()=>{ st.page--; refresh(); }; next.onclick=()=>{ st.page++; refresh(); };
        pager.appendChild(prev);
        pager.appendChild(el('span',{cls:'pager-info'},`صفحة ${st.page+1} من ${pages}`));
        pager.appendChild(next);
      }
    }
  }
  refresh();
  return outer;
}

// invSource: trace where a material's stock came from.
// Per-deal "sold" counts ONLY sales linked to that deal (purchaseId); unlinked
// sales are returned separately as a material-level figure (not attributed to a
// specific deal or supplier).
function invSource(m){
  const deals=[];
  DB.purchases.forEach((p,idx)=>{
    if(p.material!==m) return;
    const net=netIn(p);                                                    // scale weight − waste
    const sold=fq(DB.sales.filter(s=>s.purchaseId==p.id).reduce((a,s)=>a+aQty(s),0));
    deals.push({deal:idx+1,id:p.id,date:p.date,supplierId:p.supplierId,color:p.color||'',
      qty:fq(p.qty),actual:fq(aQty(p)),diff:wDiff(p),waste:fq(p.waste),net,sold,remaining:fq(net-sold),unit:p.unit,locations:p.locations||[]});
  });
  const unlinkedSold=fq(DB.sales.filter(s=>s.material===m&&!s.purchaseId).reduce((a,s)=>a+aQty(s),0));
  const bySup={};
  deals.forEach(d=>{
    if(!bySup[d.supplierId])bySup[d.supplierId]={supplierId:d.supplierId,net:0,sold:0};
    bySup[d.supplierId].net+=d.net; bySup[d.supplierId].sold+=d.sold;
  });
  const suppliers=Object.values(bySup).map(g=>({...g,net:fq(g.net),sold:fq(g.sold),remaining:fq(g.net-g.sold)}));
  return {deals,unlinkedSold,suppliers};
}

  const bals=locBalances().filter(b=>b.material===r.m && Math.abs(b.bal)>0.0005);

  const unalloc=fq(r.stock-located);
  box.appendChild(el('div',{style:'font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px'},'📍 أماكن التواجد'));
  const lchips=el('div',{style:'display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px'});
  if(!bals.length){
    lchips.appendChild(el('div',{style:'font-size:12px;color:var(--faint)'},'لسه مش متوزّعة على أماكن — اضغط «📍 توزيع» جنب أي صفقة تحت.'));
  }

      chip.innerHTML=`<div style="font-weight:600;color:var(--ink);margin-bottom:3px">${esc(sName(g.supplierId))}</div>`+
        `<div style="color:var(--muted)">متبقي: <strong style="color:${g.remaining>0?'var(--pos)':'var(--neg)'}">${g.remaining} ${r.unit}</strong>`+
        ` · وارد صافي: ${g.net} ${r.unit}${g.sold>0?` · مباع مرتبط: ${g.sold} ${r.unit}`:''}</div>`;
      chips.appendChild(chip);
    });
    box.appendChild(chips);

  // ── صفقات الشراء ──
  box.appendChild(el('div',{style:'font-size:12px;font-weight:600;color:var(--muted);margin:4px 0 8px'},'📦 صفقات الشراء'));
  const th='padding:7px 10px;text-align:right;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border);font-size:11px;white-space:nowrap';
  const tbl=el('table',{style:'width:100%;border-collapse:collapse;font-size:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden'});
  tbl.innerHTML=`<thead><tr style="background:var(--surface-2)">`+
    `<th scope="col" style="${th}">الصفقة</th><th scope="col" style="${th}">التاريخ</th><th scope="col" style="${th}">المورد</th>`+
    `<th scope="col" style="${th}">اللون</th><th scope="col" style="${th}">المتعاقد</th><th scope="col" style="${th}">الميزان</th><th scope="col" style="${th}">الهالك</th>`+
    `<th scope="col" style="${th}">الصافي</th><th scope="col" style="${th}">مباع مرتبط</th><th scope="col" style="${th}">المتبقي</th><th scope="col" style="${th}">الأماكن</th></tr></thead>`;

      `<td style="${td}">${d.qty} ${esc(d.unit)}</td>`+
      `<td style="${td}">${d.diff?`${d.actual} ${esc(d.unit)} ${diffBadge(d.diff,d.unit,'buy')}`:DASH}</td>`+
      `<td style="${td}">${d.waste>0?`<span class="c-red">${d.waste} ${esc(d.unit)}</span>`:DASH}</td>`+
      `<td style="${td};font-weight:600">${d.net} ${esc(d.unit)}</td>`+
      `<td style="${td}">${d.sold>0?`${d.sold} ${esc(d.unit)}`:DASH}</td>`+
      `<td style="${td};font-weight:600;color:${d.remaining>0?'var(--pos)':'var(--neg)'}">${d.remaining} ${esc(d.unit)}</td>`;

  }
  return box;
}

      unalloc.forEach(u=>{
        const tr=el('tr');
        tr.appendChild(el('td',{},DASH)); tr.appendChild(el('td',{},esc(u.m))); tr.appendChild(el('td',{},DASH)); tr.appendChild(el('td',{},DASH));
        tr.appendChild(el('td',{},aSpan(`${u.q} ${esc(u.unit)}`)));
        tr.appendChild(el('td',{style:'font-size:12px;color:var(--faint)'},'وزّعها من تبويب «حسب المادة» ← 📍 توزيع'));
        tr.appendChild(el('td',{},DASH)); tbody.appendChild(tr);
      });
    }
  };
  si.oninput=()=>{ DB.invQ=si.value; refresh(); };
  cb.onchange=()=>{ DB.invShowEmpty=cb.checked; refresh(); };
  prn.onclick=()=>printStockCount(visible(), (DB.invQ||'').trim()?[]:unalloc);
  refresh();
  return card;
}

function addMaterial(){
  const name=(DB.newMat||'').trim();
  if(!name){showToast('⚠ اكتب اسم المادة أولاً');return;}
  if(DB.materials.includes(name)){showToast(`⚠ المادة "${name}" موجودة بالفعل`);return;}
  DB.materials=[...DB.materials,name];
  DB.newMat='';markDirty();render();showToast(`✓ تمت إضافة "${name}"`);
}

function renderPL(){
  const from=DB.plFrom||'', to=DB.plTo||'';
  const filtered=!!(from||to);
  const invalid=!!(from && to && from>to);
  // An invalid range is ignored for the maths (we warn instead of showing nonsense zeros)
  const {cogs,totalRev,totalRevGross,discS,discP,totalExp,totalTxExp,gross,net,counts}=computedPL(invalid?'':from, invalid?'':to);
  const {inventoryValue}=computed();
  const wrap=el('div',{cls:'card'});

  // ── header: reflect the ACTIVE period honestly ──
  const dates=[...DB.purchases,...DB.sales,...DB.expenses].map(x=>x.date).filter(d=>d&&/^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
  const allRange = dates.length ? ` (من ${dates[0]} إلى ${dates[dates.length-1]})` : '';
  const title = (filtered && !invalid)
    ? `قائمة الأرباح والخسائر — من ${from||'البداية'} إلى ${to||'اليوم'}`
    : `قائمة الأرباح والخسائر — إجمالي كل العمليات${allRange}`;
  wrap.appendChild(el('div',{style:'font-size:13px;color:var(--muted);margin-bottom:14px'},esc(title)));

  // ── period filter bar ──
  const [tmF,tmT]=_monthRange(0), [lmF,lmT]=_monthRange(-1), [yF,yT]=_yearRange();
  const presets=[{l:'الكل',from:'',to:''},{l:'هذا الشهر',from:tmF,to:tmT},
                 {l:'الشهر السابق',from:lmF,to:lmT},{l:'هذه السنة',from:yF,to:yT}];
  const bar=el('div',{cls:'pl-filter'});
  const chips=el('div',{cls:'pl-presets'});
  presets.forEach(p=>{
    const on=(from===p.from && to===p.to);
    const b=el('button',{cls:`pl-chip${on?' on':''}`},p.l);
    b.onclick=()=>{DB.plFrom=p.from;DB.plTo=p.to;render();};
    chips.appendChild(b);
  });
  bar.appendChild(chips);
  const dbox=el('div',{cls:'pl-dates'});
  const mkDate=(key,label)=>{
    const d=document.createElement('div'); d.className='field';
    const l=document.createElement('label'); l.textContent=label;
    const i=document.createElement('input'); i.type='date'; i.value=DB[key]||'';
    i.onchange=e=>{ DB[key]=e.target.value; render(); };
    d.appendChild(l); d.appendChild(i); return d;
  };
  dbox.appendChild(mkDate('plFrom','من تاريخ'));
  dbox.appendChild(mkDate('plTo','إلى تاريخ'));
  bar.appendChild(dbox);
  wrap.appendChild(bar);

  if(invalid){
    wrap.appendChild(el('div',{cls:'warn-box'},'⚠ تاريخ البداية بعد تاريخ النهاية — يتم عرض إجمالي كل العمليات حتى تصحيح النطاق.'));
  } else if(filtered){
    const n=counts.sales+counts.purchases+counts.expenses;
    wrap.appendChild(el('div',{style:'font-size:11.5px;color:var(--faint);margin-bottom:12px'},
      n===0 ? '⚠ لا توجد عمليات في هذه الفترة — كل الأرقام أدناه صفر.'
            : `عمليات الفترة: ${counts.sales} مبيعات · ${counts.purchases} مشتريات · ${counts.expenses} مصروفات`));
  }
  // Sales discounts are shown as their own line (contra-revenue) so the base deal value stays visible.
  const revRows = discS>0 ? [
    {l:'إيرادات المبيعات (قبل الخصم)',v:totalRevGross,cls:'c-green',neg:false,bold:false},
    {l:'خصومات وتقريب للعملاء',v:discS,cls:'c-red',neg:true,bold:false},
    {l:'صافي إيرادات المبيعات',v:totalRev,cls:'c-green',neg:false,bold:true},
  ] : [{l:'إيرادات المبيعات',v:totalRev,cls:'c-green',neg:false,bold:false}];
  const rows=[
    ...revRows,
    {l:'تكلفة البضاعة المباعة (المباع فقط)',v:cogs,cls:'c-red',neg:true,bold:false},
    {sep:true},
    {l:'مجمل الربح',v:gross,cls:gross>=0?'c-green':'c-red',neg:false,bold:true},
    {l:'مصروفات الصفقات (مشتريات + مبيعات)',v:totalTxExp,cls:'c-red',neg:true,bold:false},
    {l:'المصروفات التشغيلية',v:totalExp,cls:'c-red',neg:true,bold:false},
    {sep:true},
    {l:'صافي الربح / الخسارة',v:net,cls:net>=0?'c-green':'c-red',neg:false,bold:true,large:true},
  ];
  rows.forEach(r=>{
    if(r.sep){wrap.appendChild(el('div',{cls:'pl-sep'}));return;}
    const div=el('div',{cls:`pl-row${r.bold?' bold':''}`});
    div.appendChild(el('span',{style:`color:${r.bold?'var(--ink)':'var(--muted)'};font-weight:${r.bold?600:400};font-size:${r.large?'15px':'13px'}`},r.l));
    div.appendChild(el('span',{cls:r.cls,style:`font-weight:${r.bold?600:400};font-size:${r.large?'18px':'13px'}`},r.neg?`(${fmt(r.v)})`:fmt(r.v)));
    wrap.appendChild(div);
  });
  const margin=totalRev>0?Math.round(net/totalRev*100):null;
  const sum=el('div',{cls:'pl-summary'});

  } else if(inventoryValue>0){

      `ℹ️ تكلفة البضاعة أعلاه تشمل المباع فقط. قيمة المخزون غير المباع <strong>${fmt(inventoryValue)}</strong> مُدرَجة كأصل في صفحة "الميزانية والسيولة".`));
  }
  const expRow=el('div',{style:'margin-top:16px'});

  expBtn.onclick=exportData;expRow.appendChild(expBtn);wrap.appendChild(expRow);

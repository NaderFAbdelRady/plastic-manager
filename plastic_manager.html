// ══ AI Advisor (المستشار الذكي) ═══════════════════════════════════════════════
// Sends a COMPACT, AGGREGATED snapshot of the books to Grok (xAI) or Gemini (Google)
// and renders the review back. Ground rules baked into the design:
//   • The API key lives in localStorage on THIS DEVICE only. It is deliberately kept
//     out of DB / buildPayload() so it can never leak into an exported plastic_data_*.json.
//   • Nothing leaves the browser until the user presses a preset button — and the exact
//     bytes that will be sent are inspectable first via "معاينة البيانات المُرسلة".
//   • Raw records are never sent, only aggregates; party names can be anonymised.

const AI_LS = 'pm_ai_settings', AI_HIST_LS = 'pm_ai_history', AI_MAX_HIST = 10;

const AI_PROVIDERS = {
  gemini:{
    label:'Google Gemini', icon:'✦', sub:'مفتاح مجاني من Google AI Studio',
    keyUrl:'https://aistudio.google.com/apikey', keyHint:'يبدأ عادةً بـ AIza…',
    models:['gemini-2.5-flash','gemini-2.5-pro','gemini-2.0-flash'],
    // Output ceiling per model. Arabic costs roughly 3-4 tokens per word, so a full
    // ~1000-word review needs ~4-5k tokens on its own; the old flat 4096 cap cut
    // almost every complete review short. 2.0-flash tops out at 8192, 2.5-* far higher.
    maxOut:{'gemini-2.5-flash':16384,'gemini-2.5-pro':16384,'gemini-2.0-flash':8192},
    async call(key,model,system,user,signal){
      const gen = {temperature:0.35, maxOutputTokens:(this.maxOut&&this.maxOut[model])||8192};
      // 2.5 models think by default and thinking tokens are charged against
      // maxOutputTokens — bound the budget so reasoning can't starve the visible answer.
      if(/^gemini-2\.5/.test(model)) gen.thinkingConfig={thinkingBudget:2048};
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{
        method:'POST', signal,
        headers:{'Content-Type':'application/json','x-goog-api-key':key},
        body:JSON.stringify({
          system_instruction:{parts:[{text:system}]},
          contents:[{role:'user',parts:[{text:user}]}],
          generationConfig:gen
        })
      });
      const j = await _aiJson(r);
      if(!r.ok) throw new Error(j?.error?.message || `HTTP ${r.status}`);
      const cand = j?.candidates?.[0];
      const txt  = (cand?.content?.parts||[]).map(p=>p.text||'').join('').trim();
      const fin  = cand?.finishReason || '';
      if(!txt) throw new Error(fin ? `لم يُرجع النموذج نصاً (${fin})` : 'رد فارغ من النموذج');
      return {text:txt, truncated: fin==='MAX_TOKENS'};
    }
  },
  grok:{
    label:'xAI Grok', icon:'⚡', sub:'مفتاح من console.x.ai',
    keyUrl:'https://console.x.ai', keyHint:'يبدأ عادةً بـ xai-…',
    models:['grok-4','grok-3','grok-3-mini'],
    maxOut:{'grok-4':16384,'grok-3':16384,'grok-3-mini':16384},
    async call(key,model,system,user,signal){
      const r = await fetch('https://api.x.ai/v1/chat/completions',{
        method:'POST', signal,
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},
        body:JSON.stringify({model,temperature:0.35,stream:false,
          max_tokens:(this.maxOut&&this.maxOut[model])||16384,
          messages:[{role:'system',content:system},{role:'user',content:user}]})
      });
      const j = await _aiJson(r);
      if(!r.ok) throw new Error(j?.error?.message || (typeof j?.error==='string'?j.error:'') || `HTTP ${r.status}`);
      const ch  = j?.choices?.[0];
      const txt = (ch?.message?.content||'').trim();
      if(!txt) throw new Error('رد فارغ من النموذج');
      return {text:txt, truncated: ch?.finish_reason==='length'};
    }
  }
};
const _aiJson = async r => { try{ return await r.json(); }catch(e){ return null; } };

// AI: view + config state. Never merged into DB — see the note above.
let AI = {
  provider:'gemini', model:'', keys:{gemini:'',grok:''},
  scope:{summary:true,monthly:true,inventory:true,parties:true,expenses:true,partners:false,flags:true},
  anonymize:false, focus:'',
  tab:'analyze', showKey:false, showPayload:false,
  busy:false, testing:false, error:'', testOk:'', result:null, _restored:false
};
let _aiAbort = null, _aiCancelled = false;

function aiLoad(){
  try{
    const s = JSON.parse(localStorage.getItem(AI_LS)||'{}');
    if(s && typeof s==='object'){
      if(AI_PROVIDERS[s.provider]) AI.provider = s.provider;
      if(typeof s.model === 'string') AI.model = s.model;
      if(s.keys && typeof s.keys==='object'){
        AI.keys.gemini = String(s.keys.gemini||''); AI.keys.grok = String(s.keys.grok||'');
      }
      if(s.scope && typeof s.scope==='object')
        Object.keys(AI.scope).forEach(k=>{ if(k in s.scope) AI.scope[k] = !!s.scope[k]; });
      AI.anonymize = !!s.anonymize;
      if(typeof s.focus === 'string') AI.focus = s.focus;
    }
  }catch(e){}
  if(!AI_PROVIDERS[AI.provider].models.includes(AI.model)) AI.model = AI_PROVIDERS[AI.provider].models[0];
  if(!AI._restored){ AI._restored = true; const h = aiHistory(); if(h[0]) AI.result = h[0]; }
}

// ── Snapshot: aggregates only, never raw records ──────────────────────────────
const _aiRound = v => Math.round(num(v));
function _aiAvgSell(m){
  const s = DB.sales.filter(x=>x.material===m);
  const q = s.reduce((a,x)=>a+billQty(x),0);
  return q>0 ? +(s.reduce((a,x)=>a+netAmt(x),0)/q).toFixed(2) : null;   // effective price after discounts
}
function _aiMonthly(n){
  const rows=[], now=new Date();
  for(let i=n-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const from = _fmtYMD(d), to = _fmtYMD(new Date(d.getFullYear(), d.getMonth()+1, 0));
    const p = computedPL(from,to);
    if(p.counts.sales || p.counts.purchases || p.counts.expenses)
      rows.push({الشهر:from.slice(0,7), مبيعات:_aiRound(p.totalRev), تكلفة_المبيعات:_aiRound(p.cogs),
                 مجمل_الربح:_aiRound(p.gross), مصروفات:_aiRound(p.totalExp+p.totalTxExp), صافي_الربح:_aiRound(p.net)});
  }
  return rows;
}
function _aiParties(anon){
  const cust = DB.customers.map((c,i)=>{
    const sl = DB.sales.filter(s=>s.customerId==c.id); if(!sl.length) return null;
    const total = sl.reduce((a,s)=>a+netAmt(s),0);
    const paid  = sl.reduce((a,s)=>a+num(s.paid),0)
                + DB.collections.filter(x=>x.customerId==c.id).reduce((a,x)=>a+num(x.amount),0);
    const dates = sl.map(s=>s.date).filter(Boolean).sort();
    return {الاسم: anon?`عميل-${i+1}`:c.name, عدد_الفواتير:sl.length, إجمالي_المبيعات:_aiRound(total),
            المسدد:_aiRound(paid), المستحق:_aiRound(total-paid), آخر_تعامل:dates[dates.length-1]||null};
  }).filter(Boolean).sort((a,b)=>b['إجمالي_المبيعات']-a['إجمالي_المبيعات']).slice(0,15);
  const supp = DB.suppliers.map((s,i)=>{
    const pu = DB.purchases.filter(p=>p.supplierId==s.id); if(!pu.length) return null;
    const total = pu.reduce((a,p)=>a+netAmt(p),0);
    const paid  = pu.reduce((a,p)=>a+num(p.paid),0)
                + DB.supplierPayments.filter(x=>x.supplierId==s.id).reduce((a,x)=>a+num(x.amount),0);
    const dates = pu.map(p=>p.date).filter(Boolean).sort();
    return {الاسم: anon?`مورد-${i+1}`:s.name, عدد_الصفقات:pu.length, إجمالي_المشتريات:_aiRound(total),
            المدفوع:_aiRound(paid), المستحق_عليه:_aiRound(total-paid), آخر_تعامل:dates[dates.length-1]||null};
  }).filter(Boolean).sort((a,b)=>b['إجمالي_المشتريات']-a['إجمالي_المشتريات']).slice(0,15);
  return {أكبر_العملاء:cust, أكبر_الموردين:supp};
}
// _aiFlags: cheap local sanity checks handed to the model as leads, not conclusions.
function _aiFlags(c,cash,anon){
  const f=[];
  c.invRows.forEach(r=>{
    if(r.stock < -0.0001) f.push(`عجز في المخزون: "${r.m}" مُباع منها أكثر من المتاح بمقدار ${(-r.stock).toFixed(2)} ${r.unit}`);
    const sell = _aiAvgSell(r.m);
    if(sell!=null && r.avgCost>0 && sell < r.avgCost)
      f.push(`متوسط سعر بيع "${r.m}" (${Math.round(sell)}) أقل من متوسط تكلفته (${Math.round(r.avgCost)})`);
    if(r.in>0 && (r.waste/r.in*100) >= 15) f.push(`نسبة هالك مرتفعة في "${r.m}": ${(r.waste/r.in*100).toFixed(1)}%`);
    if(r.stock>0 && r.out===0 && r.in>0) f.push(`"${r.m}" مشتراة ولم يُباع منها شيء — مخزون راكد بقيمة ${Math.round(r.value)} ج.م`);
  });
  if(cash.cashBalance < 0) f.push(`الرصيد النقدي سالب (${Math.round(cash.cashBalance)} ج.م) — راجع رأس المال المسجّل والدفعات`);
  const d = new Date(); d.setDate(d.getDate()-60); const cut = _fmtYMD(d);
  DB.customers.forEach((cu,i)=>{
    const sl = DB.sales.filter(s=>s.customerId==cu.id); if(!sl.length) return;
    const due = sl.reduce((a,s)=>a+netAmt(s)-num(s.paid),0)
              - DB.collections.filter(x=>x.customerId==cu.id).reduce((a,x)=>a+num(x.amount),0);
    const last = sl.map(s=>s.date).filter(Boolean).sort().pop();
    if(due > 0 && last && last < cut)
      f.push(`ذمة متأخرة: ${anon?`عميل-${i+1}`:cu.name} عليه ${Math.round(due)} ج.م وآخر تعامل ${last}`);
  });
  const badP = DB.purchases.filter(p=>num(p.qty)<=0||num(p.price)<=0).length;
  if(badP) f.push(`${badP} عملية شراء بكمية أو سعر يساوي صفر`);
  const badS = DB.sales.filter(s=>num(s.qty)<=0||num(s.price)<=0).length;
  if(badS) f.push(`${badS} عملية بيع بكمية أو سعر يساوي صفر`);
  if(num(DB.capital)<=0 && DB.purchases.length) f.push('رأس المال غير مسجّل (صفر) رغم وجود مشتريات — يجعل الرصيد النقدي مضلّلاً');
  const pct = DB.partners.reduce((a,p)=>a+num(p.sharePct),0);
  if(DB.partners.length && Math.abs(pct-100)>0.01) f.push(`مجموع نسب الشركاء ${pct}% وليس 100%`);
  return f;
}
function buildAISnapshot(){
  const sc=AI.scope, anon=!!AI.anonymize;
  const c=computed(), cash=computedCash();
  const snap={ _وصف:'لقطة مُجمَّعة من دفاتر نشاط تجارة بلاستيك — العملة: جنيه مصري. التكلفة بمتوسط مرجّح (AVCO).',
               تاريخ_اللقطة: today() };
  if(sc.summary) snap['الملخص_الإجمالي']={
    رأس_المال:_aiRound(DB.capital),
    إجمالي_المبيعات:_aiRound(c.totalRev), تكلفة_البضاعة_المباعة:_aiRound(c.cogs), مجمل_الربح:_aiRound(c.gross),
    المصروفات_التشغيلية:_aiRound(c.totalExp), مصروفات_الصفقات:_aiRound(c.totalTxExp), صافي_الربح:_aiRound(c.net),
    خصومات_للعملاء:_aiRound(c.totalDiscS), خصومات_من_الموردين:_aiRound(c.totalDiscP),
    هامش_الربح_الصافي_نسبة: c.totalRev>0 ? +(c.net/c.totalRev*100).toFixed(1) : null,
    إجمالي_المشتريات:_aiRound(c.totalCost), قيمة_المخزون_بالتكلفة:_aiRound(c.inventoryValue),
    الرصيد_النقدي:_aiRound(cash.cashBalance), ذمم_مدينة:_aiRound(cash.receivable), ذمم_دائنة:_aiRound(cash.payable),
    حقوق_الملكية:_aiRound(cash.equity), أرباح_موزّعة:_aiRound(cash.totalDistributed),
    مبالغ_مع_التجار:_aiRound(cash.traderOut), سيولة_مع_العاملين:_aiRound(cash.workerOut),
    عدد_السجلات:{مشتريات:DB.purchases.length, مبيعات:DB.sales.length, مصروفات:DB.expenses.length,
                 موردون:DB.suppliers.length, عملاء:DB.customers.length}
  };
  if(sc.monthly)   snap['الأداء_الشهري_آخر_١٢_شهراً'] = _aiMonthly(12);
  if(sc.inventory) snap['المخزون_حسب_الخامة'] = c.invRows.map(r=>{
    const sell=_aiAvgSell(r.m);
    return {الخامة:r.m, الوحدة:r.unit, مُشترى:+r.in.toFixed(2), زيادة_فروق_الموازين:+r.overIn.toFixed(2), هالك:+r.waste.toFixed(2), مُباع:+r.out.toFixed(2),
            المتبقي:+r.stock.toFixed(2), متوسط_التكلفة:Math.round(r.avgCost), قيمة_المتبقي:Math.round(r.value),
            متوسط_سعر_البيع:sell, هامش_الوحدة: sell!=null ? Math.round(sell-r.avgCost) : null,
            الألوان:(r.colors||[]).slice(0,6)};
  });
  if(sc.parties)  Object.assign(snap, _aiParties(anon));
  if(sc.expenses){
    const by={}; DB.expenses.forEach(e=>{ const k=e.cat||'غير مصنّف'; by[k]=(by[k]||0)+num(e.amount); });
    snap['المصروفات_التشغيلية_حسب_البند'] = Object.entries(by).sort((a,b)=>b[1]-a[1])
      .map(([k,v])=>({البند:k, المبلغ:_aiRound(v)}));
    const tx={}; [...DB.purchases,...DB.sales].forEach(r=>(r.txExpenses||[]).forEach(e=>{
      const k=(e.desc||'').trim()||'بدون بيان'; tx[k]=(tx[k]||0)+num(e.amount); }));
    const txRows = Object.entries(tx).sort((a,b)=>b[1]-a[1]).slice(0,12);
    if(txRows.length) snap['مصروفات_الصفقات_حسب_البند'] = txRows.map(([k,v])=>({البند:k, المبلغ:_aiRound(v)}));
  }
  if(sc.partners && DB.partners.length){
    snap['الشركاء'] = DB.partners.map((p,i)=>({الاسم:anon?`شريك-${i+1}`:p.name,
      نسبة_الشراكة:num(p.sharePct), سحوبات_معلّقة:_aiRound(partnerDraws(p.id))}));
    if(DB.distributions.length) snap['توزيعات_الأرباح'] =
      DB.distributions.map(d=>({التاريخ:d.date, المبلغ:_aiRound(d.amount)}));
  }
  if(sc.flags){ const f=_aiFlags(c,cash,anon); if(f.length) snap['مؤشرات_تستحق_المراجعة'] = f; }
  return snap;
}

// ── Network ───────────────────────────────────────────────────────────────────
function _aiErrMsg(err){
  const m = String((err && err.message) || err || 'خطأ غير معروف');
  if(/Failed to fetch|NetworkError|Load failed|ERR_/i.test(m))
    return 'تعذّر الاتصال بالخدمة. تحقّق من الإنترنت — وإذا كنت تفتح الملف مباشرةً من القرص فقد يمنع المتصفح الطلب؛ جرّب متصفحاً آخر أو شغّل الملف عبر خادم محلي.';
  if(/api key not valid|invalid.*api.?key|api.?key.*invalid|unauthorized|permission denied|\b401\b|\b403\b/i.test(m))
    return 'المفتاح غير صالح أو غير مُفعَّل لهذه الخدمة. راجع المفتاح في تبويب الإعدادات.';
  if(/quota|rate.?limit|\b429\b|RESOURCE_EXHAUSTED/i.test(m))
    return 'تم تجاوز حد الاستخدام المسموح لهذا المفتاح. انتظر قليلاً أو راجع خطة الاستخدام لديك.';
  if(/not found|\b404\b|does not exist|does not support/i.test(m))
    return `النموذج "${AI.model}" غير متاح لهذا المفتاح. اختر نموذجاً آخر من تبويب الإعدادات. (${m})`;
  return m;
}
async function aiTest(){
  const key=(AI.keys[AI.provider]||'').trim();
  if(!key){ AI.error='أدخل مفتاح API أولاً.'; AI.testOk=''; render(); return; }
  AI.testing=true; AI.error=''; AI.testOk=''; render();
  try{
    const res = await AI_PROVIDERS[AI.provider].call(key, AI.model, 'أجب بكلمة واحدة فقط.', 'قل: جاهز', null);
    AI.testOk = `✓ الاتصال ناجح — ${AI_PROVIDERS[AI.provider].label} · ${AI.model} · رد النموذج: ${res.text.slice(0,40)}`;
    aiSave();
  }catch(err){ AI.error=_aiErrMsg(err); }
  finally{ AI.testing=false; render(); }
}
async function aiRun(preset){
  if(AI.busy) return;
  if(!(AI.keys[AI.provider]||'').trim()){ AI.tab='settings'; AI.error='أدخل مفتاح API أولاً ثم عُد إلى التحليل.'; render(); return; }
  if(!DB.purchases.length && !DB.sales.length){ showToast('⚠ لا توجد بيانات كافية لتحليلها بعد'); return; }
  AI.busy=true; AI.error=''; AI.testOk=''; _aiCancelled=false; render();
  _aiAbort = new AbortController();
  const timer = setTimeout(()=>{ try{ _aiAbort && _aiAbort.abort(); }catch(e){} }, 120000);
  try{
    const res = await AI_PROVIDERS[AI.provider].call(
      (AI.keys[AI.provider]||'').trim(), AI.model, _aiSystemPrompt(), _aiUserPrompt(preset.ask), _aiAbort.signal);
    AI.result = {text:res.text, truncated:!!res.truncated, ask:preset.ask, at:new Date().toISOString(),
                 provider:AI.provider, model:AI.model, preset:preset.l};
    aiPushHistory(AI.result);
    showToast(res.truncated ? '⚠ وصل الرد إلى الحد الأقصى — اضغط "متابعة" لإكماله' : '✓ تم استلام التحليل');
  }catch(err){
    AI.error = (err && err.name==='AbortError')
      ? (_aiCancelled ? 'تم إلغاء الطلب.' : 'انتهت المهلة (دقيقتان) دون رد من الخدمة.')
      : _aiErrMsg(err);
  }finally{ clearTimeout(timer); _aiAbort=null; AI.busy=false; render(); }
}
// aiReplaceHistoryTop: a continuation updates the same analysis, it is not a new one.
function aiReplaceHistoryTop(entry){
  try{ const h=aiHistory(); h[0]=entry; localStorage.setItem(AI_HIST_LS, JSON.stringify(h.slice(0,AI_MAX_HIST))); }catch(e){}
}
// aiContinue: ask the model to resume from exactly where it stopped, and append the rest.
// The snapshot is re-sent because the API is stateless, along with the tail already received.
async function aiContinue(){
  if(AI.busy || !AI.result) return;
  const key=(AI.keys[AI.provider]||'').trim();
  if(!key){ AI.tab='settings'; AI.error='أدخل مفتاح API أولاً.'; render(); return; }
  AI.busy=true; AI.error=''; _aiCancelled=false; render();
  _aiAbort = new AbortController();
  const timer = setTimeout(()=>{ try{ _aiAbort && _aiAbort.abort(); }catch(e){} }, 120000);
  try{
    const prev = AI.result.text || '';
    const cont = [
      _aiUserPrompt(AI.result.ask || AI_PRESETS[0].ask), '', '—————',
      'لقد بدأتَ الإجابة بالفعل وانقطعت قبل أن تكتمل. هذا آخر ما كتبتَه:',
      '"""', prev.slice(-1500), '"""', '',
      'أكمل من حيث توقّفتَ بالضبط. لا تُعِد كتابة ما سبق، ولا تبدأ من جديد، ولا تكتب مقدمة أو تمهيداً.',
      'ابدأ مباشرةً بالجملة أو البند التالي، وأنهِ التقرير بالكامل.'
    ].join('\n');
    const res = await AI_PROVIDERS[AI.provider].call(key, AI.model, _aiSystemPrompt(), cont, _aiAbort.signal);
    const joined = prev.replace(/\s+$/,'') + '\n\n' + (res.text||'').replace(/^\s+/,'');
    AI.result = {...AI.result, text:joined, truncated:!!res.truncated, at:new Date().toISOString()};
    aiReplaceHistoryTop(AI.result);
    showToast(res.truncated ? '⚠ ما زال غير مكتمل — يمكنك المتابعة مرة أخرى' : '✓ تم إكمال التحليل');
  }catch(err){
    AI.error = (err && err.name==='AbortError')
      ? (_aiCancelled ? 'تم إلغاء الطلب.' : 'انتهت المهلة (دقيقتان) دون رد من الخدمة.')
      : _aiErrMsg(err);
  }finally{ clearTimeout(timer); _aiAbort=null; AI.busy=false; render(); }
}
function aiCancel(){ _aiCancelled=true; try{ _aiAbort && _aiAbort.abort(); }catch(e){} }
function aiCopy(){
  const t=(AI.result&&AI.result.text)||''; if(!t) return;
  const done=()=>showToast('✓ تم نسخ التحليل');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done).catch(()=>_aiCopyFallback(t)); }
  else _aiCopyFallback(t);
}
function _aiCopyFallback(t){
  const ta=document.createElement('textarea'); ta.value=t;
  ta.style.cssText='position:fixed;top:-9999px'; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); showToast('✓ تم نسخ التحليل'); }catch(e){ showToast('✗ تعذّر النسخ'); }
  ta.remove();
}

// ── Markdown → HTML (escape FIRST — model output is untrusted) ─────────────────
function _mdToHtml(src){
  const inline = s => s.replace(/`([^`]+)`/g,'<code>$1</code>')
                       .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
                       .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,،:؛!؟]|$)/g,'$1<em>$2</em>');
  const lines = esc(String(src||'')).replace(/\r\n?/g,'\n').split('\n');
  const out=[]; let para=[], list=null, tbl=null;
  const cells = l => l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
  const flushP=()=>{ if(para.length){ out.push(`<p>${inline(para.join('<br>'))}</p>`); para=[]; } };
  const flushL=()=>{ if(list){ out.push(`<${list.t}>${list.items.map(i=>`<li>${inline(i)}</li>`).join('')}</${list.t}>`); list=null; } };
  const flushT=()=>{ if(tbl){
    const head = tbl.head ? `<thead><tr>${tbl.head.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead>` : '';
    out.push(`<div class="tbl-wrap"><table>${head}<tbody>${tbl.rows.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
    tbl=null; } };
  const flushAll=()=>{ flushP(); flushL(); flushT(); };
  lines.forEach(raw=>{
    const l=raw.trim();
    if(!l){ flushAll(); return; }
    if(/^```/.test(l)) return;                                  // ignore fences, keep the text
    if(/^\|.*\|$/.test(l)){                                     // table row
      flushP(); flushL();
      if(/^\|[\s:|-]+\|$/.test(l) && tbl && !tbl.head && tbl.rows.length===1){ tbl.head=tbl.rows.shift(); return; }
      if(!tbl) tbl={head:null,rows:[]};
      tbl.rows.push(cells(l)); return;
    }
    flushT();
    let m;
    if((m=l.match(/^(#{1,6})\s+(.*)$/))){ flushAll(); const lv=Math.min(4,Math.max(3,m[1].length+1)); out.push(`<h${lv}>${inline(m[2])}</h${lv}>`); return; }
    if(/^([-*_])\1{2,}$/.test(l.replace(/\s/g,''))){ flushAll(); out.push('<hr>'); return; }
    if((m=l.match(/^[-*•]\s+(.*)$/))){ flushP(); if(!list||list.t!=='ul'){ flushL(); list={t:'ul',items:[]}; } list.items.push(m[1]); return; }
    if((m=l.match(/^\d+[.)]\s+(.*)$/))){ flushP(); if(!list||list.t!=='ol'){ flushL(); list={t:'ol',items:[]}; } list.items.push(m[1]); return; }
    flushL(); para.push(l);
  });
  flushAll();
  return out.join('') || '<p style="color:var(--faint)">— لا يوجد محتوى —</p>';
}

// ── Accessible dialog behaviour: remember focus, move it into the dialog, trap Tab, restore on close ──
let _modalReturnFocus=null;
function _focusables(container){
  return [...container.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]
    .filter(el=>!el.disabled && el.offsetParent!==null);
}
function _openModalUI(){
  _modalReturnFocus = document.activeElement;
  document.getElementById('modal-overlay').classList.add('open');
  const box=document.getElementById('modal-box');
  const first=_focusables(document.getElementById('modal-body'))[0] || box.querySelector('.btn-primary') || box;
  requestAnimationFrame(()=>{ try{ first.focus(); }catch(e){} });
}
function closeModal(){
  DB.modal=null; DB.form._errors=null;
  _impactBase=null;
  document.getElementById('modal-box').classList.remove('has-impact','imp-open');
  document.getElementById('modal-overlay').classList.remove('open');
  if(_modalReturnFocus && _modalReturnFocus.focus){ try{ _modalReturnFocus.focus(); }catch(e){} }
  _modalReturnFocus=null;
}
// Focus trap shared by the modal + confirm dialogs
function _trapTab(e){
  if(e.key!=='Tab') return;
  const overlay = document.getElementById('modal-overlay').classList.contains('open') ? 'modal-box'
               : document.getElementById('confirm-overlay').classList.contains('open') ? 'confirm-box' : null;
  if(!overlay) return;
  const f=_focusables(document.getElementById(overlay));
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}

// validateForm: returns a {field: message} map of validation errors ('_' = form-level)
function validateForm(type,f){
  const e={};
  const pos    = v => { const n=parseFloat(v); return Number.isFinite(n) && n>0; };
  const nonneg = v => { const n=parseFloat(v); return Number.isFinite(n) && n>=0; };
  const req    = v => v!=null && String(v).trim()!=='';
  if(type==='purchase'||type==='sale'){
    if(type==='purchase'){ if(!req(f.supplierId)) e.supplierId='اختار المورد — أو اضغط «+ مورد جديد» وضيفه من هنا'; }
    else                 { if(!req(f.customerId)) e.customerId='اختار العميل — أو اضغط «+ عميل جديد» وضيفه من هنا'; }
    if(!req(f.material)) e.material='اختر نوع المادة';
    if(!pos(f.qty))     e.qty='أدخل الوزن المتعاقد عليه (أكبر من صفر)';
    if(req(f.actualQty) && !pos(f.actualQty)) e.actualQty='الوزن الفعلي لازم يكون أكبر من صفر (أو سيبه فاضي)';
    else if(f.billOn==='actual' && !pos(f.actualQty)) e.actualQty='اكتب وزن الميزان — الحساب المالي متحدد على الوزن الفعلي';
    if(!pos(f.price))   e.price='أدخل سعراً أكبر من صفر';
    if(f.paid!=='' && f.paid!=null && !nonneg(f.paid)) e.paid='المبلغ لا يصح أن يكون سالباً';
    const phys=aQty(f);
    if(type==='purchase' && req(f.waste)){
      if(!nonneg(f.waste)) e.waste='الهالك لا يصح أن يكون سالباً';
      else if(parseFloat(f.waste) > phys+1e-9) e.waste='الهالك لا يمكن أن يتجاوز الوزن الفعلي';
    }
    // discount / rounding — stored separately, must never exceed the base deal value
    const gross=grossAmt(f);
    if(f.discMode==='pct'){
      if(req(f.discountPct)){ const p=parseFloat(f.discountPct); if(!(Number.isFinite(p)&&p>=0&&p<=100)) e.discountPct='نسبة الخصم لازم تكون بين 0 و 100'; }
    } else if(req(f.discount)){
      if(!nonneg(f.discount)) e.discount='الخصم لا يصح أن يكون سالباً';
      else if(parseFloat(f.discount) > gross+1e-9) e.discount=`الخصم أكبر من قيمة الصفقة (${fmt(gross)})`;
    }
    if(type==='sale' && f.purchaseId){
      const linked=DB.purchases.find(x=>x.id==f.purchaseId);
      if(linked){
        const soldOther=DB.sales.filter(s=>s.purchaseId==linked.id && s.id!==f._editId).reduce((a,s)=>a+aQty(s),0);
        const remaining=fq(netIn(linked)-soldOther);
        if(phys>0 && phys>remaining+1e-9) e[hasActual(f)?'actualQty':'qty']=`الكمية تتجاوز المتبقي في صفقة الشراء (${remaining} ${linked.unit})`;
      }
    }
    if(type==='purchase'){ const le=validateLocRows(f.locations, netIn(f), f.unit); if(le) e.locations=le; }
    if(type==='sale'){ const le=validateSaleLocs(f, phys); if(le) e.fromLocations=le; }
  }
  else if(type==='locations'){
    const p=DB.purchases.find(x=>x.id===f._editId);
    if(!p) e._='صفقة الشراء مش موجودة';
    else { const le=validateLocRows(f.locations, netIn(p), p.unit); if(le) e.locations=le; }
  }
  else if(type==='offset'){
    const s=DB.suppliers.find(x=>x.id==f.supplierId), c=DB.customers.find(x=>x.id==f.customerId);
    if(!s||!c) e._='الحساب الموحد مش موجود';
    else if(!pos(f.amount)) e.amount='أدخل مبلغاً أكبر من صفر';
    else {
      const u=buildUnifiedStatement(s,c), max=+Math.min(u.rec,u.pay).toFixed(2);
      if(!(max>0)) e.amount='مفيش مديونية متبادلة تتقاصّ — لازم يكون عليه وليه في نفس الوقت';
      else if(parseFloat(f.amount)>max+1e-9) e.amount=`أقصى مبلغ ينفع يتقاصّ ${fmt(max)}`;
    }
  }
  else if(type==='expense'){ if(!req(f.desc)) e.desc='اكتب بيان المصروف'; if(!pos(f.amount)) e.amount='أدخل مبلغاً أكبر من صفر'; }
  else if(type==='collection'){ if(!req(f.customerId)) e.customerId='اختر العميل'; if(!pos(f.amount)) e.amount='أدخل مبلغاً أكبر من صفر'; }
  else if(type==='supplierPay'){ if(!req(f.supplierId)) e.supplierId='اختر المورد'; if(!pos(f.amount)) e.amount='أدخل مبلغاً أكبر من صفر'; }
  else if(type==='traderAdv'||type==='workerLiq'){ if(!req(f.name)) e.name='اكتب الاسم'; if(!pos(f.amount)) e.amount='أدخل مبلغاً أكبر من صفر'; }
  else if(type==='supplier'||type==='customer'){ if(!req(f.name)) e.name='اكتب الاسم'; }
  else if(type==='partner'){
    if(!req(f.name)) e.name='اكتب اسم الشريك';
    const p=parseFloat(f.sharePct);
    if(!(Number.isFinite(p)&&p>0&&p<=100)) e.sharePct='النسبة يجب أن تكون بين 0 و 100';
  }
  else if(type==='distribution'){
    if(!DB.partners.length) e._='أضف شريكاً واحداً على الأقل أولاً';
    if(!pos(f.amount)) e.amount='أدخل مبلغاً أكبر من صفر';
    else {
      const {net,totalDistributed}=computed();
      const prev = f._editId ? (DB.distributions.find(d=>d.id===f._editId)?.amount||0) : 0;
      const avail=+(net-totalDistributed+prev).toFixed(2);
      if(parseFloat(f.amount)>avail+1e-9) e.amount=`المبلغ يتجاوز الربح المتاح للتوزيع (${fmt(avail)})`;
    }
  }
  else if(type==='capital'){ if(!nonneg(f.amount)) e.amount='أدخل قيمة صحيحة (صفر أو أكثر)'; }
  return e;
}

// validateLocRows: a purchase's location split — every used row needs a place + qty; total ≤ stock brought in
function validateLocRows(rows,target,unit){
  const used=(rows||[]).filter(r=>String(r.loc||'').trim()||String(r.sub||'').trim()||String(r.qty??'').trim()!==''||String(r.desc||'').trim());
  for(const r of used){
    if(!String(r.loc||'').trim() && !String(r.sub||'').trim()) return 'اكتب اسم المخزن أو المكان الفرعي لكل سطر فيه كمية';
    if(!(num(r.qty)>0)) return 'اكتب كمية أكبر من صفر لكل مكان';
  }
  const tot=fq(used.reduce((a,r)=>a+num(r.qty),0));
  if(tot>fq(target)+1e-9) return `مجموع الكميات في الأماكن (${tot} ${unit||''}) أكبر من الصافي اللي داخل المخزن (${fq(target)} ${unit||''})`;
  return null;
}
// validateSaleLocs: where a sale was drawn from — only places holding that material, never more than they hold
function validateSaleLocs(f,phys){
  const used=(f.fromLocations||[]).filter(r=>r.loc||r.sub||String(r.qty??'').trim()!=='');
  if(!used.length) return null;
  const opts=locOptionsFor(f.material,f._editId);
  for(const r of used){
    if(!(r.loc||r.sub)) return 'اختار المكان لكل سطر سحب';
    if(!(num(r.qty)>0)) return 'اكتب كمية أكبر من صفر لكل مكان';
    if(!opts.some(o=>o.loc===r.loc&&o.sub===r.sub)) return `المكان «${locName(r.loc,r.sub)}» مفيهوش رصيد متاح من خامة ${f.material}`;
  }
  const agg={}; used.forEach(r=>{const k=locKey(r.loc,r.sub); agg[k]=(agg[k]||0)+num(r.qty);});
  for(const o of opts){ const q=fq(agg[locKey(o.loc,o.sub)]||0); if(q>o.bal+1e-9) return `المسحوب من «${locName(o.loc,o.sub)}» (${q}) أكبر من المتاح فيه (${o.bal} ${o.unit})`; }
  const tot=fq(used.reduce((a,r)=>a+num(r.qty),0));
  if(phys>0 && tot>fq(phys)+1e-9) return `مجموع المسحوب من الأماكن (${tot}) أكبر من الوزن الفعلي للبيعة (${fq(phys)})`;
  return null;
}
// formDiscount: the discount amount (ج.م) a deal form currently implies — amount mode or % of the base value
function formDiscount(f){
  if(f.discMode==='pct'){ const p=num(f.discountPct); return p>0 ? +(grossAmt(f)*p/100).toFixed(2) : 0; }
  return Math.max(0,num(f.discount));
}

// ── buildRecord: ONE source of truth for turning a form's state into the record that gets
// saved — used by saveModal() itself AND by the live impact preview, so the preview can never
// show something different from what actually gets written to DB. Pure: never touches DB.
//   • {list, rec}   — a single record for DB[list]
//   • {multi:[...]} — several records across lists (the mutual offset)
//   • {field, value}— a single scalar field on DB (capital)
//   • null          — this modal type has no generic record (party/partner forms, handled in saveModal)
function buildRecord(type, f){
  if(type==='purchase'||type==='sale'){
    const disc=formDiscount(f), isPct=f.discMode==='pct';
    const rec={date:f.date,material:f.material,color:(f.color||'').trim(),qty:num(f.qty),unit:f.unit,price:num(f.price),paid:num(f.paid),waste:num(f.waste),txExpenses:f.txExpenses||[],
      actualQty:   hasActual(f)?num(f.actualQty):null,                               // الوزن الفعلي (الميزان)
      billOn:      (f.billOn==='actual' && hasActual(f))?'actual':'contract',        // الفلوس محسوبة على أنهي وزن
      discount:    disc>0?disc:0,                                                    // الخصم محفوظ منفصل عن قيمة الصفقة
      discountPct: (disc>0 && isPct)?num(f.discountPct):null,
      discountNote:disc>0?(f.discountNote||'').trim():''};
    if(type==='purchase'){
      rec.supplierId=f.supplierId;
      rec.locations=cleanLocs(f.locations);
      return {list:'purchases', rec};
    }
    rec.customerId=f.customerId; rec.purchaseId=f.purchaseId||null;
    rec.fromLocations=cleanLocs(f.fromLocations).map(({loc,sub,qty})=>({loc,sub,qty}));
    return {list:'sales', rec};
  }
  if(type==='expense')     return {list:'expenses',         rec:{date:f.date,cat:f.cat,desc:(f.desc||'').trim(),amount:num(f.amount)}};
  if(type==='collection')  return {list:'collections',      rec:{date:f.date,customerId:f.customerId,amount:num(f.amount),note:(f.note||'').trim()}};
  if(type==='supplierPay') return {list:'supplierPayments', rec:{date:f.date,supplierId:f.supplierId,amount:num(f.amount),note:(f.note||'').trim()}};
  if(type==='traderAdv')   return {list:'traderAdvances',   rec:{date:f.date,name:(f.name||'').trim(),desc:(f.desc||'').trim(),amount:num(f.amount),settled:f.settled||false}};
  if(type==='workerLiq')   return {list:'workerLiquidity',  rec:{date:f.date,name:(f.name||'').trim(),desc:(f.desc||'').trim(),amount:num(f.amount),returned:f.returned||false,partnerId:f.partnerId||null}};
  if(type==='offset'){
    // A mutual offset = a customer collection + a supplier payment of the same amount → cash nets to zero,
    // receivable and payable both shrink. Both halves share an `offset` group id, assigned at save time.
    const amt=+num(f.amount).toFixed(2), note=(f.note||'').trim()||'مقاصة حساب موحد';
    return {multi:[
      {list:'collections',      rec:{date:f.date,customerId:f.customerId,amount:amt,note}},
      {list:'supplierPayments', rec:{date:f.date,supplierId:f.supplierId,amount:amt,note}},
    ]};
  }
  if(type==='distribution'){
    const amt=num(f.amount);
    const totalPct=DB.partners.reduce((s,p)=>s+(+p.sharePct||0),0);
    const breakdown=DB.partners.map(p=>{
      const gross=totalPct>0?+((amt*(+p.sharePct||0)/totalPct).toFixed(2)):0;
      const outstanding=partnerDraws(p.id,f._editId);
      const drawsAbsorbed=+(Math.min(outstanding,gross).toFixed(2));
      return {partnerId:p.id,gross,drawsAbsorbed,net:+(gross-drawsAbsorbed).toFixed(2)};
    });
    return {list:'distributions', rec:{date:f.date,note:(f.note||'').trim(),amount:amt,breakdown}};
  }
  if(type==='capital') return {field:'capital', value:num(f.amount)};
  return null;
}
// commitRecord: applies buildRecord()'s output to the real DB (add or, when editing, merge-update).
function commitRecord(type,f){
  const out=buildRecord(type,f);
  if(!out) return;
  const isEdit=!!f._editId;
  const upd=(arr,rec)=>arr.map(x=>x.id===f._editId?{...x,...rec}:x);
  if(out.multi){
    const gid=uid();
    out.multi.forEach(({list,rec})=>{ DB[list]=[...DB[list],{...rec,offset:gid,id:uid()}]; });
    return;
  }
  if(out.field){ DB[out.field]=out.value; return; }
  const {list,rec}=out;
  DB[list] = isEdit ? upd(DB[list],rec) : [...DB[list],{...rec,id:uid()}];
}

function saveModal(){
  const f=DB.form;
  const isEdit=!!f._editId;
  const upd=(arr,rec)=>arr.map(x=>x.id===f._editId?{...x,...rec}:x);
  // ── validation gate ──
  const errs=validateForm(DB.modal,f);
  if(Object.keys(errs).length){
    DB.form._errors=errs;
    renderModal();
    showToast('⚠ يرجى تصحيح الحقول المميّزة بالأحمر');
    return;
  }
  DB.form._errors=null;
  // ── simple single-field modals ──
  if(DB.modal==='capital'){ commitRecord('capital',f); markDirty(); closeModal(); render(); return; }
  if(DB.modal==='closing'){ closeModal(); doCloseBalance((f.note||'').trim()); return; }
  if(DB.modal==='locations'){
    const locs=cleanLocs(f.locations);
    DB.purchases=DB.purchases.map(p=>p.id===f._editId?{...p,locations:locs}:p);
    markDirty(); closeModal(); render();
    showToast(`✓ تم حفظ توزيع الصفقة ${dealNo(f._editId)} على ${locs.length} ${locs.length===1?'مكان':'أماكن'}`);
    return;
  }
  if(DB.modal==='offset'){
    commitRecord('offset',f);
    markDirty(); closeModal(); render();
    showToast(`✓ تمت المقاصة بمبلغ ${fmt(+num(f.amount).toFixed(2))} — اتسجلت تحصيل ودفعة بنفس القيمة`);
    return;
  }
  if(['purchase','sale','expense','collection','supplierPay','traderAdv','workerLiq','distribution'].includes(DB.modal)){
    commitRecord(DB.modal,f);
  }
  else if(DB.modal==='supplier'){
    const rec={name:(f.name||'').trim(),phone:(f.phone||'').trim(),city:(f.city||'').trim()};
    let linkC=f.linkedCustomerId;
    if(linkC==='__new__'){                     // create the customer twin with the same details
      const c={id:uid(),name:rec.name,phone:rec.phone,city:rec.city};
      DB.customers=[...DB.customers,c]; linkC=c.id;
    }
    rec.linkedCustomerId=(linkC!==''&&linkC!=null)?linkC:null;
    const sid=isEdit?f._editId:uid();
    // one customer ↔ one supplier: release this customer from any other supplier first
    if(rec.linkedCustomerId!=null) DB.suppliers=DB.suppliers.map(x=>(x.id!==sid && x.linkedCustomerId==rec.linkedCustomerId)?{...x,linkedCustomerId:null}:x);
    if(isEdit) DB.suppliers=upd(DB.suppliers,rec);
    else DB.suppliers=[...DB.suppliers,{...rec,id:sid}];
  }
  else if(DB.modal==='customer'){
    const rec={name:(f.name||'').trim(),phone:(f.phone||'').trim(),city:(f.city||'').trim()};
    const cid=isEdit?f._editId:uid();
    if(isEdit) DB.customers=upd(DB.customers,rec);
    else DB.customers=[...DB.customers,{...rec,id:cid}];
    const linkS=f.linkSupplierId;
    // the link lives on the supplier record: detach any other supplier, then attach the chosen one
    DB.suppliers=DB.suppliers.map(x=>(x.linkedCustomerId==cid && x.id!==linkS)?{...x,linkedCustomerId:null}:x);
    if(linkS==='__new__') DB.suppliers=[...DB.suppliers,{id:uid(),name:rec.name,phone:rec.phone,city:rec.city,linkedCustomerId:cid}];
    else if(linkS!==''&&linkS!=null) DB.suppliers=DB.suppliers.map(x=>x.id==linkS?{...x,linkedCustomerId:cid}:x);
  }
  else if(DB.modal==='partner'){
    const rec={name:(f.name||'').trim(),sharePct:num(f.sharePct)};
    if(isEdit) DB.partners=upd(DB.partners,rec);
    else DB.partners=[...DB.partners,{...rec,id:uid()}];
  }
  markDirty();
  closeModal();render();
}
// setFQuiet: for text/number inputs — updates form value WITHOUT re-rendering the modal
// (re-rendering on every keystroke destroys focus and prevents multi-digit input)
function setFQuiet(k,v){DB.form[k]=v;refreshInfoBox();}
// setF: for selects — re-renders modal so dependent fields update correctly
function setF(k,v){
  DB.form[k]=v;
  // When a purchase deal is selected, auto-fill material & unit from it
  if(k==='purchaseId'&&v){
    const p=DB.purchases.find(x=>x.id==v);
    if(p){DB.form.material=p.material;DB.form.unit=p.unit;}
  }
  renderModal();
}

// Refresh the live read-outs inside the modal WITHOUT re-rendering it (keeps focus while typing):
// scale difference, net stock after waste, location allocation, and the money summary.
function refreshInfoBox(){
  const f=DB.form, unit=esc(f.unit||'طن');
  if(DB.modal==='distribution') updateDistBreakdown();
  if(DB.modal==='partner') updatePartnerProjected();
  // ⚖ net stock that enters the store (scale weight − waste)
  const netEl=document.getElementById('modal-net-qty');
  if(netEl){
    const phys=aQty(f), w=num(f.waste);
    netEl.textContent=phys>0?`${fq(phys-w)} ${f.unit||'طن'}`:'—';
    netEl.className='readout'+((w>0&&phys>0)?' warn':'');
  }
  // ⚖ scale difference: actual − contract
  const wd=document.getElementById('modal-wdiff');
  if(wd){
    const q=num(f.qty), a=num(f.actualQty);
    if(q>0 && a>0){
      const d=fq(a-q);
      if(d===0){ wd.textContent='✓ مطابق — مفيش فرق ميزان'; wd.className='readout pos'; }
      else {
        const buy=DB.modal==='purchase', pct=Math.abs(d/q*100).toFixed(1);
        wd.textContent=`${d>0?'▲ زيادة فعلية':'▼ فاقد'} ${fq(Math.abs(d))} ${f.unit||'طن'} (${pct}%)`;
        wd.className='readout '+(buy?(d>0?'pos':'neg'):'warn');
        wd.title=buy?(d>0?'الزيادة بتدخل المخزن من غير تكلفة إضافية':'الفاقد بيقلل اللي داخل المخزن')
                    :(d>0?'خرج من المخزن أكتر من المفوتر':'خرج من المخزن أقل من المفوتر');
      }
    } else { wd.textContent=q>0?'اكتب وزن الميزان لو مختلف':'—'; wd.className='readout'; wd.title=''; }
  }
  // 📍 location allocation
  const lr=document.getElementById('modal-loc-remain');
  if(lr){
    if(DB.modal==='sale'){
      const rows=f.fromLocations||[], tot=fq(rows.reduce((a,r)=>a+num(r.qty),0)), phys=fq(aQty(f));
      if(!rows.length) lr.innerHTML='';
      else lr.innerHTML = tot>phys+1e-9 ? `<span class="c-red">⚠ المسحوب (${tot}) أكتر من وزن البيعة (${phys} ${unit})</span>`
                                        : `متحدد مكانه: <strong>${tot}</strong> من ${phys} ${unit}`;
    } else {
      const rows=f.locations||[], tot=fq(rows.reduce((a,r)=>a+num(r.qty),0)), target=fq(locTarget()), rem=fq(target-tot);
      if(!(target>0)) lr.innerHTML='<span style="color:var(--faint)">اكتب الوزن الأول</span>';
      else if(rem>0) lr.innerHTML=`${tot>0?`موزّع ${tot} — `:''}غير موزّع: <strong class="c-amber">${rem} ${unit}</strong> من ${target}`;
      else if(rem===0) lr.innerHTML=`<span class="c-green">✓ الكمية كلها متوزعة (${target} ${unit})</span>`;
      else lr.innerHTML=`<span class="c-red">⚠ الموزّع أكتر من الصافي بـ ${-rem} ${unit}</span>`;
    }
  }
  // 📊 live impact panel — updates on every keystroke, for every modal type that moves money
  scheduleImpact();
  // 💰 money summary: base value − discount = net, then what is still outstanding
  const box=document.getElementById('modal-info-box');
  if(!box)return;
  if(num(f.price)>0 && billQty(f)>0){
    const isBuy=DB.modal==='purchase';
    const g=grossAmt(f), d=formDiscount(f), n=g-d, tx=txSum(f), remain=n-num(f.paid);
    let html=`قيمة الصفقة: <strong>${fmt(g)}</strong>`;
    if(d>0) html+=`  −  خصم: <strong>${fmt(d)}</strong>  =  الصافي: <strong>${fmt(n)}</strong>`;
    if(tx>0) html+=`  ·  مصروفات الصفقة: ${fmt(tx)}`;
    html+=`<br>المتبقي ${isBuy?'علينا للمورد':'عند العميل'}: <strong>${fmt(remain)}</strong>`;
    if(f.billOn==='actual' && hasActual(f)) html+=` <span style="opacity:.8">· الفلوس محسوبة على وزن الميزان ${fq(aQty(f))}</span>`;
    box.innerHTML=html; box.style.display='block';
  } else {
    box.style.display='none';
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// ── لوحة التأثير المباشر (Live Impact Panel) ────────────────────────────────────
// While a money-moving form is open, this shows exactly what saving it would change:
// the party's balance, cash, stock, and the accounting entry — BEFORE the user commits.
// Correctness rule: every number here comes from running the SAME functions the real
// save path uses (buildRecord + computed/computedCash/statements) against a throwaway
// copy of the ledger. The panel never re-derives its own arithmetic, so it can never
// drift from what saveModal() actually writes.
// ═══════════════════════════════════════════════════════════════════════════════

// Modal types that move money/stock and are worth previewing. Locations, closing, and the
// supplier/customer/partner contact-editing forms are excluded on purpose:
//  - "locations" only rearranges WHERE existing stock sits, no money or quantity changes.
//  - "closing" just snapshots today's numbers, it doesn't change them.
//  - party/partner edits change contact info or profit-share %, not a ledger entry.
const IMPACT_TYPES=['purchase','sale','expense','collection','supplierPay','traderAdv','workerLiq','distribution','offset','capital'];

let _impactBase=null;   // the "before" snapshot — computed once when the modal opens, held fixed while it's open

// _impactCtx: which party/material the open form concerns (so the panel can show their balance/stock)
function _impactCtx(type,f){
  if(type==='purchase') return {supplierId:f.supplierId, material:f.material, unit:f.unit};
  if(type==='sale')     return {customerId:f.customerId, material:f.material, unit:f.unit};
  if(type==='supplierPay') return {supplierId:f.supplierId};
  if(type==='collection')  return {customerId:f.customerId};
  if(type==='offset')      return {supplierId:f.supplierId, customerId:f.customerId};
  return {};
}
function _setImpactBase(type){
  if(!IMPACT_TYPES.includes(type)){ _impactBase=null; return; }
  _impactBase=impactSnapshot(DB,_impactCtx(type,DB.form));
}

// impactSnapshot: a flat map of {label, v, kind, unit?, qty?} for ledger state `db`.
// kind drives the badge colour rule: for an asset/equity figure, UP is good (green);
// for a liability (what we owe), DOWN is good (green) — going up means we owe more (red).
function impactSnapshot(db,ctx){
  const c=computed(db), k=computedCash(db);
  const s={
    cash:      {label:'الخزينة / السيولة',        v:k.cashBalance,    kind:'asset'},
    receivable:{label:'إجمالي مستحق عند العملاء',  v:k.receivable,     kind:'asset'},
    payable:   {label:'إجمالي مستحق للموردين',     v:k.payable,        kind:'liability'},
    inventory: {label:'قيمة المخزون',              v:c.inventoryValue, kind:'asset'},
    net:       {label:'صافي الربح',                v:c.net,            kind:'equity'},
    equity:    {label:'حقوق الملكية',              v:k.equity,         kind:'equity'},
  };
  // partyS / partyC (not a single shared 'party' key) so a two-sided move like the mutual
  // offset — which touches a supplier AND a customer at once — can show both cards, not just one.
  if(ctx.supplierId!=null && ctx.supplierId!==''){
    const sup=db.suppliers.find(x=>x.id==ctx.supplierId);
    if(sup) s.partyS={label:`حساب المورد: ${sup.name}`, v:buildSupplierStatement(sup,db).balance, kind:'liability', party:true};
  }
  if(ctx.customerId!=null && ctx.customerId!==''){
    const cu=db.customers.find(x=>x.id==ctx.customerId);
    if(cu) s.partyC={label:`حساب العميل: ${cu.name}`, v:buildCustomerStatement(cu,db).balance, kind:'asset', party:true};
  }
  if(ctx.material){
    const row=c.invRows.find(r=>r.m===ctx.material);
    s.stock={label:`مخزون ${ctx.material}`, v:row?row.stock:0, unit:ctx.unit||'طن', kind:'stock', qty:true};
    s.avg  ={label:`متوسط تكلفة ${ctx.material}`, v:row?row.avgCost:0, kind:'info'};
  }
  return s;
}

// previewDb: the real DB plus the record the open form would save, WITHOUT touching DB itself.
// Reuses buildRecord() — the exact function saveModal() uses — so the preview can never disagree
// with what actually gets written.
function previewDb(type,f){
  const out=buildRecord(type,f);
  if(!out) return null;
  const db={...DB};
  const put=(list,rec)=>{
    db[list] = f._editId
      ? DB[list].map(x=>x.id===f._editId ? {...x,...rec} : x)
      : [...DB[list],{...rec,id:-1}];
  };
  if(out.multi) out.multi.forEach(({list,rec})=>put(list,rec));
  else if(out.field) db[out.field]=out.value;
  else put(out.list,out.rec);
  return db;
}

// journalFor: the debit/credit entry a saved record of `type` implies. This is a fixed
// accounting rule per form type (not derived from the diff) — the split itself IS the rule.
function journalFor(type,f,rec){
  if(!rec) return [];
  const J=(dr,cr,amt)=>({dr,cr,amt});
  if(type==='purchase'||type==='sale'){
    const n=netAmt(rec), paid=num(rec.paid), tx=txSum(rec), rows=[];
    if(type==='purchase'){
      rows.push(J(`المخزون (${rec.material})`,null,n));
      if(paid>0) rows.push(J(null,'الخزينة',paid));
      if(n-paid>1e-6) rows.push(J(null,`دائنون: ${sName(rec.supplierId)}`,+(n-paid).toFixed(2)));
    } else {
      if(paid>0) rows.push(J('الخزينة',null,paid));
      if(n-paid>1e-6) rows.push(J(`مدينون: ${cName(rec.customerId)}`,null,+(n-paid).toFixed(2)));
      rows.push(J(null,'إيراد المبيعات',n));
    }
    if(tx>0) rows.push(J('مصروفات صفقة','الخزينة',tx));
    return rows;
  }
  if(type==='expense')      return [J(`مصروف: ${rec.cat}`,'الخزينة',num(rec.amount))];
  if(type==='collection')   return [J('الخزينة',`مدينون: ${cName(rec.customerId)}`,num(rec.amount))];
  if(type==='supplierPay')  return [J(`دائنون: ${sName(rec.supplierId)}`,'الخزينة',num(rec.amount))];
  if(type==='traderAdv')    return [J(`عهدة تاجر: ${rec.name}`,'الخزينة',num(rec.amount))];
  if(type==='workerLiq')    return [J(rec.partnerId?`مسحوبات شريك: ${pName(rec.partnerId)}`:`سيولة عامل: ${rec.name}`,'الخزينة',num(rec.amount))];
  if(type==='offset')       return [J(`دائنون: ${sName(f.supplierId)}`,`مدينون: ${cName(f.customerId)}`,num(f.amount))];
  if(type==='distribution') return [J('حقوق الملكية (أرباح موزّعة)','الخزينة',num(rec.amount))];
  if(type==='capital')      return num(rec.value)>DB.capital ? [J('الخزينة','رأس المال',+(num(rec.value)-DB.capital).toFixed(2))] : [];
  return [];
}

// diffSnapshots: the actual "impact" — just the difference between the before/after snapshots.
// No arithmetic of its own beyond subtraction, by design.
function diffSnapshots(before,after){
  return Object.keys(after).map(key=>{
    const b=before?.[key]?.v ?? 0, a=after[key].v, d=+(a-b).toFixed(2);
    return {key,...after[key],before:b,after:a,delta:d};
  }).filter(r=>Math.abs(r.delta)>0.004 || r.party);
}
const IMPACT_ORDER=['partyS','partyC','cash','stock','avg','receivable','payable','inventory','net','equity'];

function impactWarnings(rows,type){
  const warns=[];
  const cash=rows.find(r=>r.key==='cash');
  if(cash && cash.after<-0.004) warns.push({msg:`الخزينة هتبقى بالسالب (${fmt(cash.after)}) بعد حفظ الحركة دي.`,crit:true});
  const stock=rows.find(r=>r.key==='stock');
  if(stock && stock.after<-0.004) warns.push({msg:`مخزون ${stock.label.replace('مخزون ','')} هيبقى بالسالب (${fq(stock.after)} ${stock.unit}) — يعني بيع أكتر من الموجود فعلياً.`,crit:true});
  if(type==='supplierPay'){
    const p=rows.find(r=>r.key==='partyS');
    if(p && p.after<-0.004) warns.push({msg:'الدفعة أكبر من اللي علينا للمورد — حسابه هيتقلب لصالحنا (يبقى هو المدين).',crit:false});
  }
  if(type==='collection'){
    const p=rows.find(r=>r.key==='partyC');
    if(p && p.after<-0.004) warns.push({msg:'التحصيل أكبر من اللي على العميل — حسابه هيتقلب لصالحه (يبقى إحنا المدينون).',crit:false});
  }
  return warns;
}

function impactBadge(r){
  if(Math.abs(r.delta)<0.004) return `<span class="imp-badge imp-flat">بدون تغيير</span>`;
  if(r.kind==='info'){        // informational figures (e.g. average cost) aren't "good" or "bad" — neutral badge
    return `<span class="imp-badge imp-flat">${r.before>0?'':'رصيد جديد — '}${fmt(r.after)}</span>`;
  }
  const good = r.kind==='liability' ? r.delta<0 : r.delta>0;
  const val  = r.qty ? `${fq(Math.abs(r.delta))} ${esc(r.unit||'')}` : fmt(Math.abs(r.delta));
  const verb = r.kind==='liability' ? (r.delta>0?'زاد علينا':'قلّ علينا') : (r.delta>0?'زاد':'قلّ');
  return `<span class="imp-badge ${good?'imp-up':'imp-down'}">${r.delta>0?'▲':'▼'} ${verb} ${val}</span>`;
}
const impactAfterText = r => r.qty ? `${fq(r.after)} ${esc(r.unit||'')}` : fmt(r.after);

function impactPlaceholder(msg){
  return `<div class="imp-head"><span class="t">📊 التأثير المباشر</span></div><div class="imp-placeholder">${esc(msg)}</div>`;
}
function impactHtml(rows,journal,warns,isEdit){
  rows=[...rows].sort((a,b)=>IMPACT_ORDER.indexOf(a.key)-IMPACT_ORDER.indexOf(b.key));
  let h=`<div class="imp-head"><span class="t">📊 التأثير المباشر</span><span class="imp-live"><span class="dot"></span> معاينة حية</span></div>`;
  h+=`<div class="imp-sub">${isEdit?'صافي التغيير عن الحركة المحفوظة — لسه محفظتش':'بيتحدث تلقائياً مع كل رقم بتكتبه — لسه محفظتش'}</div>`;
  rows.filter(r=>r.party).forEach(partyRow=>{
    h+=`<div class="imp-party"><div class="who">${esc(partyRow.label)}</div>
        <div class="row"><span class="now">${fmt(partyRow.after)}</span>${impactBadge(partyRow)}</div>
        <div class="after">كان: ${fmt(partyRow.before)} ← بعد الحفظ: ${fmt(partyRow.after)}</div></div>`;
  });
  rows.filter(r=>!r.party).forEach(r=>{
    h+=`<div class="imp-row"><span class="lbl">${esc(r.label)}<span class="imp-after">بعد الحفظ: ${impactAfterText(r)}</span></span>${impactBadge(r)}</div>`;
  });
  warns.forEach(w=>{ h+=`<div class="imp-warn${w.crit?' crit':''}">⚠ ${esc(w.msg)}</div>`; });
  if(journal.length){
    const dr=journal.reduce((s,j)=>s+(j.dr?j.amt:0),0), cr=journal.reduce((s,j)=>s+(j.cr?j.amt:0),0);
    h+=`<div class="imp-journal-h">القيد المحاسبي المتوقع</div><table class="imp-journal"><tr><th>الحساب</th><th>مدين</th><th>دائن</th></tr>`;
    h+=journal.map(j=>`<tr><td>${esc(j.dr||j.cr)}</td><td class="num">${j.dr?fmt(j.amt):''}</td><td class="num">${j.cr?fmt(j.amt):''}</td></tr>`).join('');
    h+=`<tr class="total"><td>الإجمالي</td><td class="num">${fmt(dr)}</td><td class="num">${fmt(cr)}</td></tr></table>`;
  }
  return h;
}

let _impactRaf=0;
// scheduleImpact: coalesces rapid keystrokes into one recompute per animation frame.
function scheduleImpact(){
  if(!DB.modal || !IMPACT_TYPES.includes(DB.modal)) return;
  if(_impactRaf) return;
  _impactRaf=requestAnimationFrame(()=>{ _impactRaf=0; renderImpactPanel(); });
}

function renderImpactPanel(){
  const box=document.getElementById('modal-box'), panel=document.getElementById('impact-panel'), strip=document.getElementById('impact-strip'), saveBtn=document.getElementById('save-btn');
  if(!box || !panel) return;
  const type=DB.modal;
  if(!type || !IMPACT_TYPES.includes(type)){
    box.classList.remove('has-impact','imp-open');
    panel.innerHTML=''; if(strip) strip.innerHTML='';
    if(saveBtn){ saveBtn.textContent='حفظ'; saveBtn.style.background=''; }
    return;
  }
  box.classList.add('has-impact');
  const f=DB.form;
  const errs=validateForm(type,f);
  const db=Object.keys(errs).length ? null : previewDb(type,f);
  if(!db){
    panel.innerHTML=impactPlaceholder('كمّل البيانات الأساسية الأول عشان تشوف الأثر المباشر');
    if(strip) strip.innerHTML='<span>📊 كمّل البيانات الأساسية</span>';
    if(saveBtn){ saveBtn.textContent='حفظ'; saveBtn.style.background=''; }
    return;
  }
  const ctx=_impactCtx(type,f);
  const rows=diffSnapshots(_impactBase,impactSnapshot(db,ctx));
  const out=buildRecord(type,f);
  const journal=journalFor(type,f,out?.rec||null);
  const warns=impactWarnings(rows,type);
  panel.innerHTML=impactHtml(rows,journal,warns,!!f._editId);
  if(strip){
    const cashRow=rows.find(r=>r.key==='cash'), partyRows=rows.filter(r=>r.party);
    const parts=[];
    if(cashRow && Math.abs(cashRow.delta)>0.004) parts.push(`الخزنة ${cashRow.delta>0?'+':''}${fq(cashRow.delta)}`);
    partyRows.forEach(partyRow=>{
      if(Math.abs(partyRow.delta)>0.004) parts.push(`${partyRow.label.replace(/^حساب (المورد|العميل): /,'')} ${partyRow.delta>0?'+':''}${fq(partyRow.delta)}`);
    });
    strip.innerHTML=`<span>📊 ${parts.length?esc(parts.join(' · ')):'مفيش تغيير مالي'}</span><span style="color:var(--accent-ink);font-weight:800">تفاصيل ▾</span>`;
  }
  const critWarn=warns.find(w=>w.crit);
  if(saveBtn){

function updateDistBreakdown(){
  const box=document.getElementById('dist-breakdown');
  if(!box)return;
  const amt=+DB.form.amount||0;
  const totalPct=DB.partners.reduce((s,p)=>s+(+p.sharePct||0),0);
  box.innerHTML='';
  DB.partners.forEach(p=>{
    const gross=totalPct>0?amt*(+p.sharePct||0)/totalPct:0;
    const outstanding=partnerDraws(p.id,DB.form._editId);
    const absorbed=Math.min(outstanding,gross);
    const net=gross-absorbed;
    const row=el('div',{style:'padding:7px 0;border-bottom:1px solid var(--border)'});
    const top=el('div',{style:'display:flex;justify-content:space-between;font-size:13px'});

    top.appendChild(el('span',{style:'font-weight:600'},fmt(gross)));
    row.appendChild(top);
    if(absorbed>0){
      const sub=el('div',{style:'display:flex;justify-content:space-between;font-size:11px;color:var(--gold-ink);margin-top:3px'});
      sub.appendChild(el('span',{},`ناقص سحوبات سابقة${outstanding>gross?' (والباقي يترحّل)':''}`));
      sub.appendChild(el('span',{},`− ${fmt(absorbed)}`));

  const f=DB.form, g=grossAmt(f);
  if(!(g>0)){ showToast('⚠ اكتب الوزن والسعر الأول'); return; }
  const rounded=Math.floor(g/step)*step, d=+(g-rounded).toFixed(2);
  f.discMode='amount'; f.discount=d>0?d:'';

function fillLocRemainder(){

function fillSaleRemainder(){
  const f=DB.form; if(!Array.isArray(f.fromLocations)) f.fromLocations=[];
  const rows=f.fromLocations, phys=aQty(f);
  const rem=fq(phys-rows.reduce((a,r)=>a+num(r.qty),0));
  if(!(rem>0)){ showToast(phys>0?'✓ الكمية كلها متحدد مكانها':'⚠ اكتب الوزن الأول'); return; }
  const used={}; rows.forEach(r=>{ const k=locKey(r.loc,r.sub); used[k]=(used[k]||0)+num(r.qty); });
  const opts=locOptionsFor(f.material,f._editId).map(o=>({...o,free:fq(o.bal-(used[locKey(o.loc,o.sub)]||0))})).filter(o=>o.free>0);
  if(!opts.length){ showToast('⚠ مفيش رصيد متاح في الأماكن للخامة دي'); return; }
  const o=opts.find(x=>x.free>=rem)||opts[0], q=fq(Math.min(rem,o.free));
  const empty=rows.find(r=>!(r.loc||r.sub) && !(num(r.qty)>0));
  if(empty){ empty.loc=o.loc; empty.sub=o.sub; empty.qty=q; } else rows.push({loc:o.loc,sub:o.sub,qty:q});
  renderModal();
}

      sg.appendChild(el('span',{},`💡 فيه ${isSup?'عميل':'مورد'} بنفس الاسم «${esc(twin.name)}» (${isSup?cCode(twin.id):sCode(twin.id)}) — هو نفس الشخص؟`));
      const b=el('button',{cls:'btn-xs',type:'button'},'اربطهم'); b.onclick=()=>setF(key,twin.id);
      sg.appendChild(b); sec.appendChild(sg);
    }
  }
  sec.appendChild(el('div',{cls:'sec-note'},'بعد الربط هتلاقي في «حسابات الأطراف» كشف حساب موحد بيجمع اللي ليه واللي عليه ويطلعلك الصافي النهائي في مكان واحد.'));
  return sec;
}

function renderModal(){
  const type=DB.modal;if(!type)return;
  const isEdit=!!DB.form._editId;
  const titles={purchase:'مشتريات',sale:'مبيعات',expense:'مصروف',collection:'تحصيل من عميل',supplierPay:'دفعة لمورد',traderAdv:'مبلغ تاجر',workerLiq:'سيولة عامل',supplier:'مورد',customer:'عميل',partner:'شريك',distribution:'توزيع أرباح',capital:'رأس المال',closing:'تقفيل الميزانية'};
  const editTitles={capital:'تعديل رأس المال',closing:'تقفيل الميزانية',locations:'📍 توزيع أماكن التخزين',offset:'⚖ مقاصة حساب موحد'};
  document.getElementById('modal-box').classList.toggle('wide',['purchase','sale','locations'].includes(type));
  document.getElementById('modal-title').textContent=editTitles[type]||((isEdit?'تعديل ':'إضافة ')+titles[type]);
  const body=document.getElementById('modal-body');body.innerHTML='';
  const f=DB.form;
  if(f._errors && f._errors._){
    body.appendChild(el('div',{cls:'form-error-banner'},esc(f._errors._)));
  }
  if(type==='capital'){
    body.appendChild(fld('قيمة رأس المال المستثمر (ج.م)',mkInp('number','amount','0')));
    renderImpactPanel();
    return;
  }
  if(type==='closing'){
    body.appendChild(el('div',{style:'font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.7'},'سيتم حفظ لقطة من الأرقام الحالية (الربح والرصيد النقدي) دون حذف أي بيانات.'));
    body.appendChild(fld('ملاحظة (اختياري)',mkInp('text','note','بيان التقفيل')));
    renderImpactPanel();
    return;
  }
  if(type==='locations'){
    const p=DB.purchases.find(x=>x.id===f._editId);
    if(!p){ body.appendChild(el('div',{cls:'warn-box'},'صفقة الشراء مش موجودة')); renderImpactPanel(); return; }
    body.appendChild(el('div',{cls:'info-box info-buy',style:'line-height:1.9'},
      `صفقة <strong>${dealNo(p.id)}</strong> — ${esc(p.material)}${p.color?' · '+esc(p.color):''} · ${esc(sName(p.supplierId))} · ${esc(p.date)}<br>الصافي اللي دخل المخزن: <strong>${netIn(p)} ${esc(p.unit)}</strong>${hasActual(p)?` <span style="opacity:.8">(بوزن الميزان ${fq(p.actualQty)})</span>`:''}`));
    body.appendChild(buildLocEditor());
    refreshInfoBox();
    renderImpactPanel();
    return;
  }
  if(type==='offset'){
    const s=DB.suppliers.find(x=>x.id==f.supplierId), c=DB.customers.find(x=>x.id==f.customerId);
    if(!s||!c){ body.appendChild(el('div',{cls:'warn-box'},'الحساب الموحد مش موجود')); renderImpactPanel(); return; }
    const u=buildUnifiedStatement(s,c), max=Math.max(0,+Math.min(u.rec,u.pay).toFixed(2));
    body.appendChild(el('div',{cls:'info-box info-sell',style:'line-height:1.9'},
      `<strong>${esc(s.name)}</strong> <span style="opacity:.8">(${sCode(s.id)} ↔ ${cCode(c.id)})</span><br>عليه كعميل: <strong>${fmt(u.rec)}</strong> · ليه كمورد: <strong>${fmt(u.pay)}</strong><br>أقصى مبلغ ينفع يتقاصّ: <strong>${fmt(max)}</strong>`));
    body.appendChild(fld('التاريخ',mkInp('date','date')));
    body.appendChild(fld('مبلغ المقاصة (ج.م)',mkInp('number','amount','0')));
    body.appendChild(fld('ملاحظة',mkInp('text','note','مقاصة حساب موحد')));
    body.appendChild(el('div',{cls:'sec-note',style:'margin-top:4px'},'المقاصة بتسجّل «تحصيل» من حسابه كعميل و«دفعة» لحسابه كمورد بنفس المبلغ — الخزنة مش بتتأثر، بس اللي عليه واللي ليه بيقلّوا مع بعض.'));
    renderImpactPanel();
    return;
  }
  if(type==='purchase'||type==='sale'){
    const isBuy=type==='purchase';
    body.appendChild(fld('التاريخ',mkInp('date','date')));

    // ── الطرف (مورد / عميل) — مع إضافة سريعة من غير ما نسيب الصفقة ──

    } else {

    }

    // ── ⚖️ الوزن والميزان: المتعاقد عليه · الفعلي · الفرق · أساس الحساب ──
    const ws=el('div',{cls:'sec'});
    ws.appendChild(el('div',{cls:'sec-h'},`<span>⚖️ الوزن والميزان</span><span class="sec-hint">${isBuy?'المخزن بيستلم بالوزن الفعلي':'المخزن بيتخصم منه الوزن الفعلي'}</span>`));
    const w1=el('div',{cls:'field-row field-2'});

    ws.appendChild(w2);
    const bOn=f.billOn==='actual'?'actual':'contract';
    ws.appendChild(fldX('الفلوس (الحساب المالي) محسوبة على',segCtl([['contract','الوزن المتعاقد'],['actual','الوزن الفعلي (الميزان)']],bOn,v=>setF('billOn',v))));

      const w3=el('div',{cls:'field-row field-11'});

      :'مثال: الفاتورة 10 طن والعربية طلعت على الميزان 10.2 ← المخزن بيتخصم منه 10.2 عشان الجرد يفضل مظبوط، والفلوس حسب اختيارك فوق.'));

    const txExps=f.txExpenses||[];

    descI.oninput=e=>{DB.form._expDesc=e.target.value;};
    const amtI=document.createElement('input');
    amtI.type='number';amtI.step='any';amtI.min='0';
    amtI.placeholder='المبلغ';
    amtI.value=DB.form._expAmt||'';
    amtI.style.cssText='flex:1;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:13px;font-family:inherit;outline:none';
    amtI.oninput=e=>{DB.form._expAmt=e.target.value;};
    amtI.onkeydown=e=>{if(e.key==='Enter')addTxExp();};
    const addB=document.createElement('button');
    addB.className='btn-primary';addB.textContent='+ إضافة';addB.style.whiteSpace='nowrap';
    addB.onclick=addTxExp;
    addRow.appendChild(descI);addRow.appendChild(amtI);addRow.appendChild(addB);
    body.appendChild(addRow);
    refreshInfoBox();
  } else if(type==='expense'){
    body.appendChild(fld('التاريخ',mkInp('date','date')));
    body.appendChild(fld('الفئة',mkSel(EXP_CATS,'cat')));
    body.appendChild(fld('البيان',mkInp('text','desc','وصف المصروف')));
    body.appendChild(fld('المبلغ (ج.م)',mkInp('number','amount','0')));
  } else if(type==='collection'){
    body.appendChild(fld('التاريخ',mkInp('date','date')));
    body.appendChild(fld('العميل',mkSel(DB.customers,'customerId')));
    body.appendChild(fld('المبلغ المحصّل (ج.م)',mkInp('number','amount','0')));
    body.appendChild(fld('ملاحظة',mkInp('text','note','رقم إيصال، طريقة الدفع...')));
  } else if(type==='supplierPay'){
    body.appendChild(fld('التاريخ',mkInp('date','date')));
    body.appendChild(fld('المورد',mkSel(DB.suppliers,'supplierId')));
    body.appendChild(fld('المبلغ المدفوع (ج.م)',mkInp('number','amount','0')));
    body.appendChild(fld('ملاحظة',mkInp('text','note','رقم تحويل، شيك...')));
  } else if(type==='traderAdv'||type==='workerLiq'){
    const isTa=type==='traderAdv';
    body.appendChild(fld('التاريخ',mkInp('date','date')));
    body.appendChild(fld(isTa?'اسم التاجر':'اسم العامل',mkInp('text','name',isTa?'اسم التاجر / الشركة':'اسم العامل')));
    body.appendChild(fld('البيان',mkInp('text','desc','وصف المبلغ')));
    body.appendChild(fld('المبلغ (ج.م)',mkInp('number','amount','0')));
    if(!isTa&&DB.partners.length){
      const pOpts=[{id:'',name:'— بدون (عامل عادي) —'},...DB.partners];
      body.appendChild(fld('ربط بشريك (اختياري)',mkSel(pOpts,'partnerId')));
      body.appendChild(el('div',{style:'font-size:11px;color:var(--faint);margin-top:-6px'},'لو المبلغ ده فعلياً سحب شريك على حساب أرباحه المستقبلية، اربطه هنا — هيتخصم تلقائياً من نصيبه أول ما يتم توزيع أرباح.'));
    }
  } else if(type==='partner'){
    body.appendChild(fld('اسم الشريك',mkInp('text','name','اسم الشريك')));
    body.appendChild(fld('نسبة الحصة (%)',mkInp('number','sharePct','0')));
    body.appendChild(el('div',{id:'partner-projected',style:'font-size:12px;margin-top:-4px'}));
    updatePartnerProjected();
  } else if(type==='distribution'){
    body.appendChild(fld('التاريخ',mkInp('date','date')));
    if(!DB.partners.length){
      body.appendChild(el('div',{cls:'warn-box'},'⚠ لا يوجد شركاء مُعرَّفون — أضف شريكاً أولاً من قسم "توزيع الأرباح"'));
    } else {
      const {net,totalDistributed}=computed();
      const avail=net-totalDistributed;

      body.appendChild(fld('المبلغ المراد توزيعه (ج.م)',mkInp('number','amount','0')));
      body.appendChild(fld('ملاحظة (اختياري)',mkInp('text','note','بيان التوزيع')));
      const sep=document.createElement('div');
      sep.style.cssText='margin:14px 0 6px;font-size:11px;color:var(--faint)';
      sep.textContent='توزيع المبلغ على الشركاء حسب النسب';
      body.appendChild(sep);
      body.appendChild(el('div',{id:'dist-breakdown'}));
      updateDistBreakdown();
    }
  } else {
    const isSup=type==='supplier';
    body.appendChild(fld('الاسم',mkInp('text','name',isSup?'اسم المورد':'اسم العميل / المصنع')));
    body.appendChild(fld('التليفون',mkInp('text','phone','01xxxxxxxxx')));
    body.appendChild(fld('المدينة',mkInp('text','city','المدينة')));
    body.appendChild(buildLinkSection(isSup));
  }
  renderImpactPanel();
}

// ── Balance View ──────────────────────────────────────────────────────────────
function renderBalance(){
  const {totalCost,totalRev,totalExp,totalTxExp,net,totalDistributed,inventoryValue}=computed();
  const txExpP=DB.purchases.reduce((s,p)=>s+(p.txExpenses||[]).reduce((a,e)=>a+num(e.amount),0),0);

  // Cash, receivables & payables — single source of truth (shared with the AI snapshot).
  // invValue = unsold stock at weighted-average cost, carried as a Balance-sheet asset.
  const {cashIn,collIn,cashOutBuy,suppPaid,cashOutExp,traderOut,workerOut,
         partnerDrawsOut,cashBalance,receivable,payable,invValue} = computedCash();

  const div=el('div',{style:'display:flex;flex-direction:column;gap:14px'});

  // ─ رأس المال
  const capCard=el('div',{cls:'card'});
  const capHead=el('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:14px'});
  capHead.appendChild(el('div',{style:'font-size:13px;font-weight:600'},'💰 رأس المال'));
  const capEditBtn=el('button',{cls:'btn-ghost',style:'font-size:12px;padding:5px 12px'},'تعديل');
  capEditBtn.onclick=()=>openModal('capital');
  capHead.appendChild(capEditBtn);
  capCard.appendChild(capHead);
  const capGrid=el('div',{style:'display:grid;grid-template-columns:repeat(3,1fr);gap:10px'});
  [{l:'رأس المال المستثمر',v:fmt(DB.capital),c:''},{l:'صافي الربح المتراكم',v:fmt(net),c:net>=0?'c-green':'c-red'},{l:'حقوق الملكية',v:fmt(DB.capital+net-totalDistributed),c:(DB.capital+net-totalDistributed)>=0?'c-green':'c-red'}]

    {l:'محصّل من العملاء (بالصفقات)',v:cashIn,plus:true},
    {l:'تحصيلات إضافية من العملاء',v:collIn,plus:true},
    {l:'مدفوع للموردين (بالصفقات)',v:cashOutBuy,plus:false},
    {l:'دفعات إضافية للموردين',v:suppPaid,plus:false},
    {l:'مصروفات تشغيلية وصفقات',v:cashOutExp,plus:false},
    {l:'مبالغ مع التجار (تحت الحساب)',v:traderOut,plus:false},
    {l:'سيولة مع العاملين',v:workerOut,plus:false},
    {l:'سحوبات الشركاء المعلّقة (لم تُخصم بعد)',v:partnerDrawsOut,plus:false},
    {l:'أرباح موزّعة على الشركاء',v:totalDistributed,plus:false},
  ];
  liqRows.forEach(r=>{
    const row=el('div',{style:'display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px'});
    row.appendChild(el('span',{style:'color:var(--muted)'},r.l));
    row.appendChild(el('span',{style:`font-weight:500;color:${r.plus?'var(--pos)':'var(--neg)'}`},(r.plus?'+ ':r.v>0?'− ':'')+fmt(r.v)));

  div.appendChild(liqCard);

  // ─ المخزون والذمم (الأصول)

  const recGrid=el('div',{style:'display:grid;grid-template-columns:repeat(3,1fr);gap:10px'});
  [{l:'قيمة المخزون (بالتكلفة)',v:fmt(invValue),c:''},
   {l:'ذمم مدينة (عملاء لم يدفعوا)',v:fmt(receivable),c:'c-green'},
   {l:'ذمم دائنة (موردون لم يُدفع لهم)',v:fmt(payable),c:'c-red'}]
  .forEach(s=>{const sc=el('div',{style:'background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:12px'});sc.appendChild(el('div',{style:'font-size:11px;color:var(--muted);margin-bottom:4px'},s.l));sc.appendChild(el('div',{cls:`stat-value ${s.c}`,style:'font-size:14px'},s.v));recGrid.appendChild(sc);});
  recCard.appendChild(recGrid);
  recCard.appendChild(el('div',{style:'margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:13px'},
    `<span style="color:var(--muted)">إجمالي الأصول التقديري (نقد + مخزون + ذمم مدينة)</span><strong>${fmt(cashBalance+invValue+receivable)}</strong>`));
  div.appendChild(recCard);

  // ─ مبالغ مع التجار
  const taCard=el('div',{cls:'card'});
  const taHead=el('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:14px'});
  taHead.appendChild(el('div',{style:'font-size:13px;font-weight:600'},'🤝 مبالغ مدفوعة للتجار (تحت الحساب)'));
  const taBtn=el('button',{cls:'btn-primary',style:'font-size:12px;padding:5px 14px'},'+ إضافة');
  taBtn.onclick=()=>openModal('traderAdv');
  taHead.appendChild(taBtn);
  taCard.appendChild(taHead);
  const taCols=[
    {key:'date',label:'التاريخ'},
    {key:'name',label:'اسم التاجر'},
    {key:'desc',label:'البيان'},
    {key:'amount',label:'المبلغ',render:r=>aSpan(fmt(r.amount))},
    {key:'status',label:'الحالة',render:r=>r.settled
      ?'<span class="badge badge-success">محسوم</span>'
      :`<span class="badge badge-warning">تحت الحساب</span>`},
    {key:'toggle',label:'',render:r=>{
      const b=document.createElement('button');
      b.className='btn-ghost';b.style.cssText='font-size:11px;padding:3px 10px';
      b.textContent=r.settled?'فتح':'تحسيم';
      b.onclick=()=>{const idx=DB.traderAdvances.findIndex(x=>x.id===r.id);if(idx>=0){DB.traderAdvances[idx].settled=!DB.traderAdvances[idx].settled;markDirty();render();}};
      return b;
    }},
  ];
  taCard.appendChild(makeTable(taCols,DB.traderAdvances,id=>deleteWithUndo('traderAdvances',id,'مبلغ التاجر'),r=>openEditModal('traderAdv',r)));
  if(DB.traderAdvances.length){
    const tot=el('div',{style:'margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:13px'});
    const total=DB.traderAdvances.reduce((s,a)=>s+a.amount,0);
    const settled=DB.traderAdvances.filter(a=>a.settled).reduce((s,a)=>s+a.amount,0);
    tot.innerHTML=`<span style="color:var(--muted)">الإجمالي: <strong>${fmt(total)}</strong></span><span style="color:var(--muted)">محسوم: <strong class="c-green">${fmt(settled)}</strong>  |  تحت الحساب: <strong class="c-amber">${fmt(total-settled)}</strong></span>`;
    taCard.appendChild(tot);
  }
  div.appendChild(taCard);

  // ─ سيولة مع العاملين
  const wlCard=el('div',{cls:'card'});
  const wlHead=el('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:14px'});
  wlHead.appendChild(el('div',{style:'font-size:13px;font-weight:600'},'👷 سيولة مع العاملين'));
  const wlBtn=el('button',{cls:'btn-primary',style:'font-size:12px;padding:5px 14px'},'+ إضافة');
  wlBtn.onclick=()=>openModal('workerLiq');
  wlHead.appendChild(wlBtn);
  wlCard.appendChild(wlHead);
  // Per-record absorption status: distributions absorb a partner's outstanding draws (oldest first).
  // A row still labelled "معلّق" only if a distribution hasn't yet absorbed it — keeps this view
  // consistent with the partner-draws figure on the "توزيع الأرباح" screen.
  const absStatus={};
  DB.partners.forEach(p=>{
    const recs=DB.workerLiquidity.filter(w=>w.partnerId==p.id && !w.returned)
      .slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    const raw=recs.reduce((s,w)=>s+num(w.amount),0);
    let budget=Math.max(0, raw - partnerDraws(p.id));   // amount already absorbed by distributions
    recs.forEach(w=>{const amt=num(w.amount);
      if(budget>=amt-1e-9){absStatus[w.id]='full';budget-=amt;}
      else if(budget>1e-9){absStatus[w.id]='partial';budget=0;}
      else absStatus[w.id]='none';});
  });
  const wlCols=[
    {key:'date',label:'التاريخ'},
    {key:'name',label:'اسم العامل'},
    {key:'partner',label:'شريك؟',render:r=>r.partnerId?`<span class="badge" style="background:var(--gold-soft);color:var(--gold-ink)">🔗 ${esc(pName(r.partnerId))}</span>`:'<span style="color:var(--faint-2)">—</span>'},
    {key:'desc',label:'البيان'},
    {key:'amount',label:'المبلغ',render:r=>aSpan(fmt(r.amount))},
    {key:'status',label:'الحالة',render:r=>{
      if(r.returned) return `<span class="badge badge-success">${r.partnerId?'مسدَّد نقداً':'مرتجع'}</span>`;
      if(!r.partnerId) return '<span class="badge badge-warning">مع العامل</span>';
      const st=absStatus[r.id];
      if(st==='full')    return '<span class="badge badge-success">مُخصَم بالتوزيع</span>';
      if(st==='partial') return '<span class="badge badge-warning">مخصوم جزئياً بالتوزيع</span>';
      return '<span class="badge badge-warning">معلّق — يُخصم من نصيبه بالأرباح</span>';
    }},
    {key:'toggle',label:'',render:r=>{
      const b=document.createElement('button');
      b.className='btn-ghost';b.style.cssText='font-size:11px;padding:3px 10px';
      b.textContent=r.returned?'فتح':(r.partnerId?'سداد نقدي':'تسليم');
      b.onclick=()=>{const idx=DB.workerLiquidity.findIndex(x=>x.id===r.id);if(idx>=0){DB.workerLiquidity[idx].returned=!DB.workerLiquidity[idx].returned;markDirty();render();}};
      return b;
    }},
  ];
  wlCard.appendChild(makeTable(wlCols,DB.workerLiquidity,id=>deleteWithUndo('workerLiquidity',id,'سيولة العامل'),r=>openEditModal('workerLiq',r)));
  if(DB.workerLiquidity.length){
    const tot=el('div',{style:'margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:13px'});
    const total=DB.workerLiquidity.reduce((s,w)=>s+w.amount,0);
    const returned=DB.workerLiquidity.filter(w=>w.returned).reduce((s,w)=>s+w.amount,0);
    tot.innerHTML=`<span style="color:var(--muted)">الإجمالي: <strong>${fmt(total)}</strong></span><span style="color:var(--muted)">مرتجع: <strong class="c-green">${fmt(returned)}</strong>  |  مع العاملين: <strong class="c-amber">${fmt(total-returned)}</strong></span>`;
    wlCard.appendChild(tot);
  }
  div.appendChild(wlCard);

  // ─ تقفيل الميزانية
  const clCard=el('div',{cls:'card'});
  const clHead=el('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:14px'});
  clHead.appendChild(el('div',{style:'font-size:13px;font-weight:600'},'🔒 تقفيل الميزانية'));
  const clBtn=el('button',{cls:'btn-success',style:'font-size:12px;padding:5px 14px'},'تقفيل الآن');
  clBtn.onclick=()=>closeBalance();
  clHead.appendChild(clBtn);
  clCard.appendChild(clHead);
  if(!DB.closings.length){
    clCard.appendChild(el('div',{style:'color:var(--faint);font-size:13px;padding:10px 0;text-align:center'},'لا توجد تقفيلات سابقة'));
  } else {
    DB.closings.slice().reverse().forEach(c=>{
      const row=el('div',{style:'display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px'});
      const left=el('div');
      left.appendChild(el('div',{style:'color:var(--ink);font-weight:500'},c.date));
      if(c.note)left.appendChild(el('div',{style:'color:var(--faint);font-size:11px;margin-top:2px'},c.note));
      row.appendChild(left);
      const right=el('div',{style:'text-align:left'});
      right.appendChild(el('div',{style:`font-weight:600;color:${c.net>=0?'var(--pos)':'var(--neg)'}`},`ربح: ${fmt(c.net)}`));
      right.appendChild(el('div',{style:'font-size:11px;color:var(--faint)'},`رصيد نقدي: ${fmt(c.cash)}`));
      row.appendChild(right);
      clCard.appendChild(row);
    });
  }
  clCard.appendChild(el('div',{style:'margin-top:10px;font-size:11px;color:var(--faint)'},'التقفيل يحفظ لقطة من الأرقام الحالية دون حذف أي بيانات.'));
  div.appendChild(clCard);

  return div;
}

function closeBalance(){ openModal('closing'); }
function doCloseBalance(note){
  const {net,totalExp,totalTxExp,totalDistributed}=computed();
  const cashIn   =DB.sales.reduce((s,r)=>s+r.paid,0);
  const collIn   =DB.collections.reduce((s,r)=>s+r.amount,0);
  const cashOutBuy=DB.purchases.reduce((s,r)=>s+r.paid,0);
  const suppPaid =DB.supplierPayments.reduce((s,r)=>s+r.amount,0);
  const cashOutExp=totalExp+totalTxExp;
  const traderOut=DB.traderAdvances.filter(a=>!a.settled).reduce((s,a)=>s+a.amount,0);
  const workerOut=DB.workerLiquidity.filter(w=>!w.returned&&!w.partnerId).reduce((s,w)=>s+w.amount,0);
  const partnerDrawsOut=partnerDrawsTotal();
  const cash=DB.capital+cashIn+collIn-cashOutBuy-suppPaid-cashOutExp-traderOut-workerOut-partnerDrawsOut-totalDistributed;
  DB.closings.push({id:uid(),date:new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'}),note:note||'',net,cash});
  markDirty();render();showToast('✓ تم تقفيل الميزانية بنجاح');
}

// Statements carry the NET deal value (after discount); the description keeps weights & discount visible.
function buildCustomerStatement(c,db=DB){
  const sales=db.sales.filter(s=>s.customerId==c.id);
  const colls=db.collections.filter(x=>x.customerId==c.id);
  const total=sales.reduce((s,r)=>s+netAmt(r),0);
  const paidInTx=sales.reduce((s,r)=>s+num(r.paid),0);
  const collTotal=colls.reduce((s,x)=>s+num(x.amount),0);
  const balance=total-paidInTx-collTotal;
  const entries=[
    ...sales.map(r=>({date:r.date,type:'بيع',desc:dealDesc(r),debit:netAmt(r),credit:num(r.paid)})),
    ...colls.map(r=>({date:r.date,type:r.offset?'مقاصة':'تحصيل',desc:r.note||'دفعة',debit:0,credit:num(r.amount)})),
  ].sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  return {entries,balance};
}
function buildSupplierStatement(s,db=DB){
  const purch=db.purchases.filter(p=>p.supplierId==s.id);
  const pays=db.supplierPayments.filter(x=>x.supplierId==s.id);
  const total=purch.reduce((a,r)=>a+netAmt(r),0);
  const paidInTx=purch.reduce((a,r)=>a+num(r.paid),0);
  const payTotal=pays.reduce((a,x)=>a+num(x.amount),0);
  const balance=total-paidInTx-payTotal;
  const entries=[
    ...purch.map(r=>({date:r.date,type:'شراء',desc:dealDesc(r),debit:netAmt(r),credit:num(r.paid)})),
    ...pays.map(r=>({date:r.date,type:r.offset?'مقاصة':'دفعة',desc:r.note||'دفعة',debit:0,credit:num(r.amount)})),
  ].sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  return {entries,balance};
}
// ── Unified (dual-role) statement ───────────────────────────────────────────────
// One entity that is both our customer (c) and our supplier (s). From OUR side:
//   عليه (he owes us)  = sales to him + our payments to him
//   ليه  (we owe him)  = his payments to us + purchases from him
//   net = rec − pay  → > 0 : صافي لينا عنده ,  < 0 : صافي ليه عندنا
function buildUnifiedStatement(s,c){
  const cs=buildCustomerStatement(c), ss=buildSupplierStatement(s);
  const entries=[
    ...cs.entries.map(e=>({date:e.date,type:e.type,role:'عميل',desc:e.desc,alayh:e.debit,lahu:e.credit})),
    ...ss.entries.map(e=>({date:e.date,type:e.type,role:'مورد',desc:e.desc,alayh:e.credit,lahu:e.debit})),
  ].sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  return {entries, rec:cs.balance, pay:ss.balance, net:cs.balance-ss.balance};
}

function showCustomerStatement(c){

function showSupplierStatement(s){

function printCustomerStatement(c){
